# Veridian Analytics Engine — CI dev (durcie phase 2)
#
# Branche `dev` = bac à sable hot-reload sur dev-pub via Tailscale.
# Pas de deploy CI, pas de build d'image GHCR : le dev tourne en bind-mount
# sur dev-pub (cf scripts/dev-up.sh).
#
# Ce workflow est désormais bloquant côté checks (vs. POC initial où il ne
# bloquait rien). On garde la même surface — pas de build/deploy — mais
# tout ce qui peut être vérifié sans environnement réel doit passer vert.

name: Dev checks (no deploy)

on:
  push:
    branches: [dev]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'releases/**'
      - 'TODO.md'
      - 'todo/**'
  pull_request:
    branches: [dev]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'releases/**'
      - 'TODO.md'
      - 'todo/**'
  workflow_dispatch:

concurrency:
  group: analytics-engine-dev-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write

jobs:
  # ─── Étage A : Quick checks (lint + test) ─────────────────────────
  bridge-checks:
    name: Bridge — typecheck + tests
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: veridian-bridge
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: veridian-bridge/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npx tsc --noEmit
      - run: npm run test:ci

  sdk-checks:
    name: SDK — build + vitest
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: sdk/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npm test

  # NB : les tests Jest API upstream tournent dans test.yml séparé.
  # Ils ne sont PAS bloquants ici parce que le fork upstream a parfois des
  # tests cassés sur dev qu'on triage en phase 2 (cf. CI-ARCHITECTURE.md §6).

  # ─── Étage B : Audit static + ENV sync ───────────────────────────
  static-audit:
    name: Audit static (eval/exec/secrets)
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run static audit
        env:
          BASE_REF: origin/${{ github.base_ref || 'dev' }}
        run: |
          # Pour les pushes (pas PR), compare HEAD à HEAD~1
          if [ "${{ github.event_name }}" = "push" ]; then
            export BASE_REF="HEAD~1"
          fi
          ./scripts/ci/static-audit.sh
      - name: Run env sync
        run: ./scripts/ci/check-env-sync.sh

  # ─── Étage C : YAML + compose lint ───────────────────────────────
  compose-lint:
    name: Compose — syntax check
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Install tooling
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq yamllint
      - name: yamllint compose + workflows
        run: |
          yamllint -d "{rules: {line-length: {max: 200}, document-start: disable, truthy: disable, comments-indentation: disable}}" \
            compose/*.yml \
            .github/workflows/*.yml
      - name: docker compose dev — config check
        env:
          CLICKHOUSE_PASSWORD: ci-clickhouse-pass
          ENCRYPTION_KEY: ci-encryption-key-32-chars-minimum
          STAMINADS_ADMIN_PASSWORD: ci-staminads-pass
          VERIDIAN_ADMIN_API_KEY: ci-veridian-admin-key-32-chars-min
        run: docker compose -f compose/dev.yml config -q

  # ─── Étage D : Trivy FS scan (non bloquant sur dev) ──────────────
  trivy-fs:
    name: Trivy FS scan (warn-only sur dev)
    permissions:
      contents: read
      security-events: write
    uses: ./.github/workflows/_trivy-fs.yml
    with:
      scan-path: '.'
      severity: 'CRITICAL,HIGH'
      ignore-unfixed: true
      skip-license: true
      sarif-upload: true
      continue-on-error: true   # warn-only sur dev — bloquant côté staging/prod

  # ─── Étage E : CVE audit bridge (bloquant sur high) ──────────────
  audit-bridge:
    name: CVE audit (bridge)
    uses: ./.github/workflows/_audit-cve.yml
    with:
      app-path: veridian-bridge
      node-version: "22"
      omit-dev: true
      level: "high"
