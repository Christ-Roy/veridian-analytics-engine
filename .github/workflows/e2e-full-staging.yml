# Veridian Analytics Engine — E2E full staging (nightly + on-demand)
#
# Trigger : nightly 02:00 UTC + workflow_dispatch
#
# Exécute la suite complète disponible :
#   - 01-smoke (≈10s)
#   - 06-hub-contract (rejection + provision si HUB_HMAC_SECRET_STAGING fourni)
#   - 11-demo-public (contre demo-staging avec DEMO_SECRET_ANALYTICS_STAGING)
#   - (à étendre quand phases 3-4 livrées : 02, 03, 04, 05, 07, 08, 09, 10, 12, 13)
#
# Non-bloquant CI (warn + issue auto sur fail). Si tu veux durcir, monte
# `continue-on-error: false` partout.
#
# Durée cible : < 30 min.

name: E2E full staging

on:
  schedule:
    - cron: "0 2 * * *" # daily 02:00 UTC
  workflow_dispatch:

concurrency:
  group: e2e-full-staging
  cancel-in-progress: true

permissions:
  contents: read
  issues: write

jobs:
  full-suite:
    name: Full E2E (staging + demo-staging)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CI: "true"
    defaults:
      run:
        working-directory: tests/e2e
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Playwright + deps
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium webkit

      # ─── Staging (engine + bridge) ─────────────────────────────────
      - name: Full battery staging (all P0+P1 suites)
        env:
          TARGET: staging
          BRIDGE_ADMIN_TOKEN: ${{ secrets.E2E_BRIDGE_ADMIN_TOKEN_STAGING }}
          E2E_BRIDGE_TEST_WORKSPACE_ID: ${{ secrets.E2E_BRIDGE_TEST_WORKSPACE_ID_STAGING }}
          E2E_TEST_WORKSPACE_ID: ${{ secrets.E2E_TEST_WORKSPACE_ID_STAGING }}
          E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL_STAGING }}
          E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD_STAGING }}
          E2E_TEST_SITE_KEY: ${{ secrets.E2E_TEST_SITE_KEY_STAGING }}
          HUB_HMAC_SECRET: ${{ secrets.HUB_HMAC_SECRET_ANALYTICS_STAGING }}
          PLATFORM_ADMIN_API_KEY: ${{ secrets.PLATFORM_ADMIN_API_KEY_STAGING }}
        run: |
          # Specs mortes retirées (vision 2026-05-23 + bridge décommissionné) :
          # 03-forms-leads, 04-push-pwa, 13-cross-app-inbound. Le parcours
          # métier réel est désormais couvert par le GATE 00-gate-onpremise
          # (workflow e2e-gate-onpremise, bloquant sur push staging).
          npx playwright test \
            00-gate-onpremise/ \
            01-smoke/ \
            02-bugs-regression/ \
            02-tracker-to-dashboard/ \
            05-gsc-oauth/ \
            07-settings-credentials/ \
            08-voip-calls/ \
            09-dashboard-ui/ \
            10-onboarding-wizard/ \
            12-auth-flow/ \
            18-api-contract/ \
            19-sdk-tracker/ \
            --project=chromium-desktop || true

      - name: Mobile responsive (staging)
        env:
          TARGET: staging
          E2E_TEST_WORKSPACE_ID: ${{ secrets.E2E_TEST_WORKSPACE_ID_STAGING }}
        run: |
          npx playwright test 09-dashboard-ui/mobile-responsive.spec.ts \
            --project=chromium-mobile

      - name: HMAC contract 06 (staging) — full suite
        env:
          TARGET: staging
          HUB_HMAC_SECRET: ${{ secrets.HUB_HMAC_SECRET_ANALYTICS_STAGING }}
        run: |
          npx playwright test 06-hub-contract/ \
            --project=chromium-desktop

      # ─── Demo staging (full restricted guards + seed + UI) ──────────
      - name: Demo 11 + bugs P0 + dashboard UI (demo-staging) — full
        env:
          TARGET: demo-staging
          DEMO_SECRET: ${{ secrets.DEMO_SECRET_ANALYTICS_STAGING }}
        run: |
          npx playwright test \
            11-demo-public/ \
            02-bugs-regression/ \
            09-dashboard-ui/dashboard-sections-render.spec.ts \
            --project=chromium-desktop

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-full-staging
          path: |
            tests/e2e/playwright-report/
            tests/e2e/test-results/
          retention-days: 14

      - name: Auto-create/close GitHub issues for tagged tests
        if: always()
        working-directory: .
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
        run: |
          REPORT="tests/e2e/test-results/results.json"
          if [ ! -f "$REPORT" ]; then
            echo "::warning::No results.json — skipping issue auto-create"
            exit 0
          fi
          node scripts/ci/e2e-report-to-issues.mjs \
            --report "$REPORT" \
            --target staging || true

      - name: Open umbrella issue on nightly fail
        if: failure() && github.event_name == 'schedule'
        uses: actions/github-script@v7
        with:
          script: |
            const today = new Date().toISOString().slice(0, 10);
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'e2e-full-staging-failure',
            });
            const existing = issues.data.find(i => i.title.includes(`Nightly E2E full staging failed (${today})`));
            if (!existing) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `Nightly E2E full staging failed (${today})`,
                labels: ['e2e-full-staging-failure', 'staging', 'bug'],
                body: `La suite E2E nightly a échoué cette nuit.\n\n` +
                      `Run: https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n\n` +
                      `Voir issues détaillées \`e2e-regression\` pour les tests rouges spécifiques.\n\n` +
                      `Pas bloquant pour les deploys, mais à corriger pour ne pas accumuler de dette.`,
              });
            }
