# Veridian Analytics Engine — E2E full staging (nightly + on-demand)
#
# Trigger : nightly 02:00 UTC + workflow_dispatch
#
# Exécute la suite complète disponible :
#   - 01-smoke (≈10s)
#   - 06-hub-contract (rejection + provision si HUB_HMAC_SECRET_STAGING fourni)
#   - 11-demo-public (contre demo-staging avec DEMO_SECRET_ANALYTICS_STAGING)
#   - (à étendre quand phases 3-4 livrées : 02, 03, 04, 05, 07, 08, 09, 10, 12, 13)
#
# Non-bloquant CI (warn + issue auto sur fail). Si tu veux durcir, monte
# `continue-on-error: false` partout.
#
# Durée cible : < 30 min.

name: E2E full staging

on:
  schedule:
    - cron: "0 2 * * *" # daily 02:00 UTC
  workflow_dispatch:

concurrency:
  group: e2e-full-staging
  cancel-in-progress: true

permissions:
  contents: read
  issues: write

jobs:
  full-suite:
    name: Full E2E (staging + demo-staging)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CI: "true"
    defaults:
      run:
        working-directory: tests/e2e
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Playwright + deps
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium webkit

      # ─── Staging (engine + bridge) ─────────────────────────────────
      - name: Smoke 01 (staging)
        env:
          TARGET: staging
        run: npx playwright test 01-smoke/ --project=chromium-desktop --reporter=list

      - name: HMAC contract 06 (staging) — full suite
        env:
          TARGET: staging
          HUB_HMAC_SECRET: ${{ secrets.HUB_HMAC_SECRET_ANALYTICS_STAGING }}
        run: |
          npx playwright test 06-hub-contract/ \
            --project=chromium-desktop \
            --reporter=list

      # ─── Demo staging (full restricted guards + seed) ──────────────
      - name: Demo 11 (demo-staging) — full
        env:
          TARGET: demo-staging
          DEMO_SECRET: ${{ secrets.DEMO_SECRET_ANALYTICS_STAGING }}
        run: |
          npx playwright test 11-demo-public/ \
            --project=chromium-desktop \
            --reporter=list

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-full-staging
          path: |
            tests/e2e/playwright-report/
            tests/e2e/test-results/
          retention-days: 14

      - name: Open issue on nightly fail
        if: failure() && github.event_name == 'schedule'
        uses: actions/github-script@v7
        with:
          script: |
            const today = new Date().toISOString().slice(0, 10);
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'e2e-full-staging-failure',
            });
            const existing = issues.data.find(i => i.title.includes(`Nightly E2E full staging failed (${today})`));
            if (!existing) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `Nightly E2E full staging failed (${today})`,
                labels: ['e2e-full-staging-failure', 'staging', 'bug'],
                body: `La suite E2E nightly a échoué cette nuit.\n\n` +
                      `Run: https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n\n` +
                      `Pas bloquant pour les deploys, mais à corriger pour ne pas accumuler de dette.`,
              });
            }
