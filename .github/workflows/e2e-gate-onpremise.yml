# Veridian Analytics Engine — E2E GATE on-premise (rempart avant promo prod)
#
# CE WORKFLOW EST LE GATE E2E ON-PREMISE. C'est le rempart que Robert exige
# avant tout passage en prod : un E2E lourd qui tourne RÉELLEMENT (pas
# cancel/skip), teste le VRAI scope commercialisé (les 3 features de la vision
# 2026-05-23) contre le staging RÉEL (ClickHouse réel, Postgres réel), via
# l'API M2M native `POST /api/admin/platform/*`.
#
# Spec exécutée : tests/e2e/00-gate-onpremise/onpremise-gate.spec.ts
#   1. Tracking : provision → snippet → ingestion round-trip ClickHouse
#      (tracking.verify dry-run+purge) → /api/track public → analytics.query
#   2. Calls / VoIP : add + list phone number par source
#   3. Search Console : gsc.status (connecteur câblé)
#   + cleanup self-contained (workspace jetable purgé, zéro pollution)
#
# Déclenchement :
#   - AUTO sur push `staging` (le gate tourne à chaque livraison staging)
#   - workflow_dispatch (relance manuelle avant une promo prod)
#
# BLOQUANT : un fail = le gate est rouge → on NE promote PAS staging → main.
# Durée cible : < 15 min (une seule spec ciblée, ClickHouse round-trip réel).
#
# Historique : ce fichier portait l'ancien "E2E business flows" jamais exécuté
# (trigger release/** inexistant) qui testait le micro-service bridge
# décommissionné + des features mortes (forms). Réécrit 2026-06-23 en gate réel.

name: E2E gate on-premise

on:
  push:
    branches: [staging]
    # On ne déclenche le gate que si quelque chose de testable a bougé :
    # code applicatif, SDK, ou la batterie E2E elle-même. Un changement
    # purement doc/todo ne nécessite pas de re-rouler le round-trip ClickHouse.
    paths:
      - "api/**"
      - "sdk/**"
      - "console/**"
      - "tests/e2e/**"
      - ".github/workflows/e2e-gate-onpremise.yml"
  workflow_dispatch:

# Non-cancel : on NE veut PAS qu'un push staging suivant annule un gate en
# cours (c'était le bug de l'ancien e2e-full-staging — cancel-in-progress:true
# → "cancelled" systématique). On laisse chaque gate finir, on sérialise.
concurrency:
  group: e2e-gate-onpremise-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  gate:
    name: E2E gate on-premise (vrai scope — staging réel)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: "true"
      TARGET: staging
    defaults:
      run:
        working-directory: tests/e2e
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Playwright + deps
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Wait for staging to be healthy
        run: |
          echo "Attente de analytics-engine.staging.veridian.site/api/health…"
          for i in $(seq 1 30); do
            code=$(curl -s -m 10 -o /dev/null -w "%{http_code}" \
              https://analytics-engine.staging.veridian.site/api/health || echo 000)
            if [ "$code" = "200" ]; then
              echo "Staging healthy (200)."
              exit 0
            fi
            echo "  tentative $i/30 → HTTP $code, retry dans 10s"
            sleep 10
          done
          echo "::error::Staging jamais healthy après 5 min — gate ne peut pas tourner."
          exit 1

      - name: Run the on-premise gate (00-gate-onpremise)
        env:
          # Clé M2M staging (déjà câblée pour le déploiement staging).
          PLATFORM_ADMIN_API_KEY: ${{ secrets.PLATFORM_ADMIN_API_KEY_STAGING }}
          # Super-admin staging pour le cleanup self-contained (best-effort).
          E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL_STAGING }}
          E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD_STAGING }}
        run: |
          if [ -z "$PLATFORM_ADMIN_API_KEY" ]; then
            echo "::error::PLATFORM_ADMIN_API_KEY_STAGING secret absent — le gate ne peut pas valider l'API M2M. Configure le secret repo."
            exit 1
          fi
          npx playwright test 00-gate-onpremise/ --project=chromium-desktop

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-gate-onpremise
          path: |
            tests/e2e/playwright-report/
            tests/e2e/test-results/
          retention-days: 30

      - name: Open umbrella issue if the gate fails
        if: failure() && github.event_name == 'push'
        uses: actions/github-script@v7
        with:
          script: |
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'e2e-gate-failure',
            });
            const existing = issues.data.find(i => i.title.includes('E2E gate on-premise failed'));
            if (!existing) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `E2E gate on-premise failed (run ${context.runId})`,
                labels: ['e2e-gate-failure', 'staging', 'bug'],
                body: `**Le gate E2E on-premise est ROUGE — NE PAS promote staging → main.**\n\n` +
                      `Run: https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n` +
                      `SHA: ${context.sha}\n\n` +
                      `Le gate teste le vrai scope commercialisé (tracking/ClickHouse, VoIP, GSC) ` +
                      `via l'API M2M contre staging réel. Un rouge ici = une régression sur le ` +
                      `parcours métier réel. Investiguer l'artifact \`playwright-report-gate-onpremise\` ` +
                      `avant toute promotion prod.`,
              });
            }
