# Veridian Analytics Engine — E2E smoke prod
#
# Trigger : workflow_run après "Prod CI/CD" success (étage deploy-prod)
#           OU workflow_dispatch manuel
#
# Exécute :
#   - 01-smoke contre prod (https://analytics-engine.app.veridian.site)
#   - 01-smoke contre demo-prod (https://demo-analytics.veridian.site)
#   - 06-hub-contract HMAC rejection (sans écrire, juste les rejets)
#   - 11-demo-public accessible + restricted-guards
#   - 21-anti-regression-2026-05-25 (setup-locked + helmet + FR — sprint
#     commercial bétonnage : doit casser le déploiement si helmet/setup/FR
#     régressent en prod)
#
# Bloquant : si fail, le job déclenche le workflow rollback-prod (déjà câblé
# côté prod-ci.yml via re-run).
#
# Durée cible : < 3 min.

name: E2E smoke prod

on:
  workflow_run:
    workflows: ["Prod CI/CD"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: e2e-smoke-prod
  cancel-in-progress: false

permissions:
  contents: read
  issues: write
  actions: write   # pour re-trigger rollback workflow si fail

jobs:
  smoke:
    name: Smoke prod + demo-prod
    if: |
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CI: "true"
    defaults:
      run:
        working-directory: tests/e2e
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Playwright + deps
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium

      # ─── Prod target (BLOQUANT — un fail déclenche rollback) ───────
      - name: Prod — Smoke 01 + bugs P0 02 + HMAC rejection 06 + anti-régression 21
        env:
          TARGET: prod
        run: |
          npx playwright test \
            01-smoke/ \
            02-bugs-regression/ \
            06-hub-contract/hmac-rejection.spec.ts \
            21-anti-regression-2026-05-25/ \
            --project=chromium-desktop

      # Sauvegarder le report prod avant qu'il soit écrasé par le run démo
      - name: Save prod test-results for issue creator
        if: always()
        run: |
          mkdir -p tests/e2e/test-results-prod
          cp -r tests/e2e/test-results/* tests/e2e/test-results-prod/ 2>/dev/null || true
          ls tests/e2e/test-results-prod/ | head -5

      # ─── Demo prod (NON-BLOQUANT — sert à GÉNÉRER du travail via issues) ──
      # Ces tests trouvent des bugs UI démo (BUG-02/03/05/06/12/21 etc.). On
      # NE veut PAS qu'un bug démo déclenche un rollback prod (la démo est
      # standalone, son crash ne casse pas les tenants). MAIS on veut que les
      # rouges créent des issues GitHub pour les agents UI.
      - name: Demo-prod — Smoke + bugs P0 + dashboard UI (non-bloquant)
        continue-on-error: true
        env:
          TARGET: demo-prod
        run: |
          npx playwright test \
            01-smoke/ \
            02-bugs-regression/ \
            11-demo-public/demo-accessible.spec.ts \
            11-demo-public/demo-banner-cta.spec.ts \
            11-demo-public/demo-restricted-guards.spec.ts \
            11-demo-public/demo-workspace-pages-not-blank.spec.ts \
            09-dashboard-ui/dashboard-sections-render.spec.ts \
            --project=chromium-desktop

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-smoke-prod
          path: |
            tests/e2e/playwright-report/
            tests/e2e/test-results/
          retention-days: 30

      - name: Auto-create/close GitHub issues for tagged tests (@critical/@bug-XX)
        if: always() && github.event_name != 'workflow_dispatch'
        working-directory: .
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
        run: |
          # On a deux rapports : test-results-prod/ (prod, bloquant) et
          # test-results/ (dernier = démo-prod, non-bloquant). On traite les
          # deux pour créer/fermer les issues correspondantes.
          if [ -f tests/e2e/test-results-prod/results.json ]; then
            echo "── Processing PROD report ──"
            node scripts/ci/e2e-report-to-issues.mjs \
              --report tests/e2e/test-results-prod/results.json \
              --target prod || true
          fi
          if [ -f tests/e2e/test-results/results.json ]; then
            echo "── Processing DEMO-PROD report ──"
            node scripts/ci/e2e-report-to-issues.mjs \
              --report tests/e2e/test-results/results.json \
              --target demo-prod || true
          fi

      - name: Open umbrella issue on prod fail
        if: failure() && github.event_name != 'workflow_dispatch'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `URGENT: Smoke prod failed (run ${context.runId})`,
              labels: ['e2e-smoke-failure', 'prod', 'urgent', 'bug'],
              body: `**SMOKE PROD A ÉCHOUÉ — investigation immédiate requise.**\n\n` +
                    `Run: https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n` +
                    `SHA: ${context.sha}\n\n` +
                    `Voir les issues détaillées avec label \`e2e-regression\` pour les tests rouges spécifiques.\n\n` +
                    `Étapes :\n` +
                    `1. Vérifier l'artifact \`playwright-report-smoke-prod\`\n` +
                    `2. Lancer un rollback prod si le issue est confirmé\n` +
                    `3. Investiguer la cause root\n`,
            });
