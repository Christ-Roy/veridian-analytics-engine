# Veridian Analytics Engine — E2E visual regression (hebdo)
#
# Trigger : weekly Sunday 03:00 UTC + workflow_dispatch
#
# Compare les screenshots du dashboard/demo entre la version vivante et les
# golden images committés dans `tests/e2e/14-perf-regression/__snapshots__/`.
#
# STATUS : suite 14 pas encore implémentée (Phase 4). Ce workflow existe pour
# avoir le câblage prêt — il skip tant que pas de spec dans 14-perf-regression/.
#
# Update goldens : `workflow_dispatch` avec input `update-snapshots=true`
# crée une PR avec les nouvelles golden images.

name: E2E visual regression

on:
  schedule:
    - cron: "0 3 * * 0" # weekly Sunday 03:00 UTC
  workflow_dispatch:
    inputs:
      update-snapshots:
        description: "Update golden snapshots (creates a PR)"
        type: boolean
        default: false

concurrency:
  group: e2e-visual-regression
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  visual:
    name: Visual regression (14-perf-regression)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TARGET: staging
      CI: "true"
    defaults:
      run:
        working-directory: tests/e2e
    steps:
      - uses: actions/checkout@v4

      - name: Check if suite 14 exists
        id: check
        run: |
          if [ -d "14-perf-regression" ] && [ -n "$(ls 14-perf-regression/*.spec.ts 2>/dev/null)" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Suite 14-perf-regression vide — workflow skip (Phase 4 pas encore livrée)"
          fi

      - name: Setup Node 22
        if: steps.check.outputs.exists == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Playwright + deps
        if: steps.check.outputs.exists == 'true'
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Run visual regression
        if: steps.check.outputs.exists == 'true' && inputs.update-snapshots != true
        run: npx playwright test 14-perf-regression/ --reporter=list

      - name: Update golden snapshots
        if: steps.check.outputs.exists == 'true' && inputs.update-snapshots == true
        run: npx playwright test 14-perf-regression/ --update-snapshots --reporter=list

      - name: Upload diff on failure
        if: steps.check.outputs.exists == 'true' && failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-diff
          path: tests/e2e/test-results/
          retention-days: 30

      - name: Create PR with new snapshots
        if: steps.check.outputs.exists == 'true' && inputs.update-snapshots == true
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "test(e2e): update visual regression snapshots"
          title: "test(e2e): update visual regression snapshots"
          body: |
            Auto-generated PR — review the visual diffs before merge.
            Triggered by: ${{ github.actor }} (workflow_dispatch)
          branch: e2e/update-visual-snapshots
          base: staging
          labels: e2e-visual-regression
