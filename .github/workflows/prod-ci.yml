# Veridian Analytics Engine — Prod CI/CD
#
# Trigger : push contrôlé sur `main` après preuve staging, ou
#           `workflow_dispatch` manuel sur `main`.
#
# Pipeline :
#   1. structural-gate     — exige staging vert ≤24h si fichiers structurels
#   2. build               — images GHCR immuables + Trivy bloquant (bridge)
#   3. deploy-prod         — backups vérifiés + Nomad via bastion
#   4. e2e-prod-smoke      — Playwright contre les URLs prod
#
# Inspiré directement de veridian-hub/.github/workflows/hub-ci.yml.

name: Prod CI/CD

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'releases/**'
      - 'TODO.md'
      - 'todo/**'
  workflow_dispatch:
    inputs:
      skip-rollback:
        description: "Skip auto-rollback (debug uniquement)"
        type: boolean
        default: false

concurrency:
  group: analytics-engine-prod-${{ github.ref }}
  cancel-in-progress: false   # prod = sérialisé, pas de cancel mi-deploy

permissions:
  contents: read
  packages: write
  security-events: write
  # actions: read — requis par le job `structural-gate` : il appelle
  # `gh run list --workflow staging-deploy.yml` pour vérifier qu'un run
  # staging vert ≤24h existe sur un ancêtre du HEAD. Sans cette permission
  # l'appel API renvoie 403, le `2>/dev/null || echo '[]'` l'avale, RUNS
  # est vide et le gate bloque TOUTE promotion structurelle à tort.
  actions: read

env:
  REGISTRY: ghcr.io
  ENGINE_IMAGE: christ-roy/veridian-analytics-engine
  BRIDGE_IMAGE: christ-roy/veridian-analytics-bridge

jobs:
  # ─── Étage 0 : Structural gate ───────────────────────────────────
  # Si HEAD touche Dockerfile/compose/package-lock/workflows, exige un
  # run staging vert ≤24h sur un ancêtre. Skip sur workflow_dispatch.
  structural-gate:
    name: Structural change gate
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    outputs:
      has-structural: ${{ steps.detect.outputs.has-structural }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 50
      - name: Detect structural changes
        id: detect
        run: ./scripts/ci/check-structural-changes.sh || true
        env:
          BASE_REF: HEAD~1
      - name: Require staging fresh (gh CLI lookup)
        if: steps.detect.outputs.has-structural == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          # Cherche un run staging-deploy.yml vert ≤24h sur un SHA ancêtre HEAD
          HEAD_ANCESTORS=$(git log --format='%H' -n 50)
          NOW_TS=$(date -u +%s)
          MAX_AGE=$((24 * 3600))

          # Pas de `2>/dev/null || echo '[]'` : un échec de `gh run list`
          # (403 permission, rate-limit, panne API) doit faire ÉCHOUER le
          # gate bruyamment — pas le transformer en faux "aucun staging
          # vert" silencieux.
          RUNS=$(gh run list --workflow staging-deploy.yml --branch staging \
                              --status success --limit 20 \
                              --json databaseId,headSha,createdAt)
          MATCH=""
          while IFS=$'\t' read -r run_id sha created; do
            ts=$(date -u -d "$created" +%s 2>/dev/null || echo 0)
            age=$((NOW_TS - ts))
            [ "$age" -gt "$MAX_AGE" ] && continue
            if echo "$HEAD_ANCESTORS" | grep -q "^${sha}$"; then
              MATCH="run=$run_id sha=$sha age=$((age/3600))h"
              break
            fi
          done < <(echo "$RUNS" | jq -r '.[] | "\(.databaseId)\t\(.headSha)\t\(.createdAt)"')

          if [ -z "$MATCH" ]; then
            echo "::error::Aucun staging vert récent (≤24h) sur ancêtre HEAD. Bloqué."
            echo "Rejouer staging avant de promote sur main."
            exit 1
          fi
          echo "✓ Staging fresh trouvé : $MATCH"

  # ─── Étage 1 : Build prod ─────────────────────────────────────────
  build:
    name: Build prod images
    needs: structural-gate
    if: |
      always() &&
      (needs.structural-gate.result == 'success' || needs.structural-gate.result == 'skipped') &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
      security-events: write
    outputs:
      engine_tag: ${{ steps.tag.outputs.engine_tag }}
      bridge_tag: ${{ steps.tag.outputs.bridge_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Invariants GitOps Nomad
        run: ./scripts/ci/check-nomad-gitops-reliability.sh

      - id: tag
        run: |
          SHA=${GITHUB_SHA:0:7}
          {
            echo "engine_tag=prod-${SHA}"
            echo "bridge_tag=prod-${SHA}"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag latest as :rollback (pre-deploy)
        continue-on-error: true
        run: |
          for img in "${{ env.ENGINE_IMAGE }}" "${{ env.BRIDGE_IMAGE }}"; do
            docker pull "${{ env.REGISTRY }}/${img}:latest" 2>/dev/null && \
              docker tag "${{ env.REGISTRY }}/${img}:latest" "${{ env.REGISTRY }}/${img}:rollback" && \
              docker push "${{ env.REGISTRY }}/${img}:rollback" || true
          done

      - name: Build + push engine
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          # GIT_SHA injecté dans l'image → ENV GIT_SHA → /api/health.gitSha.
          # Le verdict de deploy (wait-dokploy-deploy.sh) confirme que la prod
          # sert bien CE SHA (preuve du BON code déployé, pas juste d'un code sain).
          build-args: |
            GIT_SHA=${{ github.sha }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.ENGINE_IMAGE }}:${{ steps.tag.outputs.engine_tag }}
            ${{ env.REGISTRY }}/${{ env.ENGINE_IMAGE }}:latest
          cache-from: type=gha,scope=engine-prod
          cache-to: type=gha,scope=engine-prod,mode=max
          # === 2026-09-02 === le stage `production` est EXCLU du cache de couches
          # et l'image de base est re-résolue. `RUN apk upgrade --no-cache` ne se
          # réexécute jamais tant que sa clé de cache est stable, or elle l'est :
          # `--no-cache` est une option d'apk, pas du cache de couches (mesuré sur
          # notifuse-veridian, run 33254429451 : `RUN apk upgrade … CACHED`).
          # Sans cette exclusion, l'image ne reçoit AUCUN correctif système.
          no-cache-filters: production
          pull: true

      - name: Build + push bridge
        uses: docker/build-push-action@v5
        with:
          context: veridian-bridge
          file: veridian-bridge/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.BRIDGE_IMAGE }}:${{ steps.tag.outputs.bridge_tag }}
            ${{ env.REGISTRY }}/${{ env.BRIDGE_IMAGE }}:latest
          cache-from: type=gha,scope=bridge-prod
          cache-to: type=gha,scope=bridge-prod,mode=max
          # === 2026-09-02 === le stage `runtime` est EXCLU du cache de couches
          # et l'image de base est re-résolue. `RUN apk upgrade --no-cache` ne se
          # réexécute jamais tant que sa clé de cache est stable, or elle l'est :
          # `--no-cache` est une option d'apk, pas du cache de couches (mesuré sur
          # notifuse-veridian, run 33254429451 : `RUN apk upgrade … CACHED`).
          # Sans cette exclusion, l'image ne reçoit AUCUN correctif système.
          no-cache-filters: runtime
          pull: true

  # if explicite : `build` est gated `if: always()` (à cause du
  # structural-gate qui peut être skipped sur workflow_dispatch). Sans
  # `if:` propre, GitHub évalue `success()` qui retourne false dès qu'un
  # job de la chaîne (ici structural-gate) est skipped → trivy/deploy se
  # faisaient skipper même quand le build était vert. `!cancelled() &&
  # needs.build.result == 'success'` les lie au vrai résultat du build.
  trivy-bridge:
    name: Trivy image — bridge (bloquant)
    needs: build
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    uses: ./.github/workflows/_trivy-image.yml
    with:
      image-ref: ghcr.io/christ-roy/veridian-analytics-bridge:latest
      severity: 'CRITICAL,HIGH'
      ignore-unfixed: true
      sbom-upload: true
      sarif-upload: true
      continue-on-error: false
      trivyignore-path: 'veridian-bridge/.trivyignore'

  trivy-engine:
    name: Trivy image — engine (warn-only)
    needs: build
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    uses: ./.github/workflows/_trivy-image.yml
    with:
      image-ref: ghcr.io/christ-roy/veridian-analytics-engine:latest
      severity: 'CRITICAL,HIGH'
      ignore-unfixed: true
      sbom-upload: true
      sarif-upload: true
      continue-on-error: true   # upstream staminads, on suit
      trivyignore-path: '.trivyignore'

  # ─── Étage 2 : Deploy prod (Nomad via bastion) ────────────────────
  #
  # Migration Dokploy→Nomad (cluster 3 nœuds, Dokploy décommissionné 2026-07-10).
  # Déploie le job versionné deploy/analytics-engine.nomad.hcl : SSH→bastion,
  # token sourcé IN SITU, `nomad job plan`→`run -detach -var image_tag=prod-<sha>`.
  # Rollback = auto_revert du job (stanza `update`) — Nomad ramène la version
  # saine si le déploiement échoue ses checks. Pas de job de rollback CI.
  deploy-prod:
    name: Deploy prod (Nomad)
    needs: [build, trivy-bridge]
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.trivy-bridge.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: production
      url: https://analytics-engine.app.veridian.site
    env:
      IMAGE_TAG: ${{ needs.build.outputs.engine_tag }}
      JOB_FILE: deploy/analytics-engine.nomad.hcl
      NOMAD_JOB: analytics-engine
      REMOTE_HCL: /tmp/analytics-engine-${{ github.run_id }}.nomad.hcl
    steps:
      - uses: actions/checkout@v4

      - name: Guard image tag (refus d'un tag mouvant)
        run: |
          if [ -z "$IMAGE_TAG" ]; then
            echo "::error::engine_tag manquant (build outputs) — refus de déployer un tag mouvant"
            exit 1
          fi

      - name: Install SSH key (bastion Nomad)
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.NOMAD_DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          for attempt in 1 2 3; do
            if ssh-keyscan -T 15 -H "${{ secrets.NOMAD_BASTION_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null; then
              exit 0
            fi
            echo "ssh-keyscan tentative $attempt/3 en échec"
            sleep 3
          done
          echo "::error::impossible de récupérer la clé SSH du bastion"
          exit 1

      # HCL DU REPO (déclare `variable "image_tag"`), jamais la copie du bastion.
      - name: Copy HCL to bastion
        run: |
          scp -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=accept-new \
            "$JOB_FILE" \
            "${{ secrets.NOMAD_BASTION_USER }}@${{ secrets.NOMAD_BASTION_HOST }}:$REMOTE_HCL"

      # Sauvegarde canonique + pré-pull authentifié sur ovh-prod + deploy +
      # monitoring CIBLÉ (canon prospection, ticket NOMAD-GITOPS §4 pièges).
      # (2) Nomad ne pull pas ghcr privé → pré-pull via prod-pub (auth GHCR déjà
      # en place) ; (4) monitor du DeploymentID EXACT via Evaluation ID
      # (pas un poll `job status | grep successful` qui lit le déploiement précédent).
      - name: Pré-pull + nomad plan + run -detach + monitor ciblé
        run: |
          ssh -i ~/.ssh/id_ed25519 \
            "${{ secrets.NOMAD_BASTION_USER }}@${{ secrets.NOMAD_BASTION_HOST }}" \
            "IMAGE_TAG='${IMAGE_TAG}' REMOTE_HCL='${REMOTE_HCL}' bash -s" <<'REMOTE'
          set -euo pipefail
          source ~/credentials/nomad-bastion.env
          export NOMAD_ADDR NOMAD_TOKEN="$NOMAD_MGMT_TOKEN"

          echo "== nomad job validate =="
          /usr/bin/nomad job validate -var "image_tag=${IMAGE_TAG}" "$REMOTE_HCL"
          echo "== nomad job plan (diff, inoffensif) =="
          set +e
          PLAN_OUTPUT=$(/usr/bin/nomad job plan -no-color \
            -var "image_tag=${IMAGE_TAG}" "$REMOTE_HCL" 2>&1)
          PLAN_STATUS=$?
          set -e
          printf '%s\n' "$PLAN_OUTPUT"
          case "$PLAN_STATUS" in
            0) echo "plan sans création ou destruction d'allocation" ;;
            1) echo "plan avec remplacement d'allocation attendu" ;;
            *) echo "::error::nomad job plan a échoué (code=$PLAN_STATUS)"; exit "$PLAN_STATUS" ;;
          esac
          MODIFY_INDEX=$(printf '%s\n' "$PLAN_OUTPUT" \
            | sed -n 's/^Job Modify Index: \([0-9][0-9]*\)$/\1/p' | tail -1)
          RUN_INDEX_ARGS=()
          [ -n "$MODIFY_INDEX" ] && RUN_INDEX_ARGS=(-check-index "$MODIFY_INDEX")

          # Le groupe redémarre ClickHouse et PostgreSQL. Réutilise les deux
          # runners canoniques : snapshot logique cross-nœud, puis copie R2 des
          # six PostgreSQL. Toute sauvegarde vide ou non vérifiée bloque le run.
          echo "== sauvegarde stateful cross-nœud pré-déploiement =="
          /home/brunon5/nomad-veridian/scripts/veridian-node-backup.sh
          echo "== sauvegarde PostgreSQL hors site vers R2 =="
          /home/brunon5/all-cron/backups/prod-r2-backup.sh

          echo "== pré-pull engine+bridge sur ovh-prod =="
          PULLED=""
          for attempt in 1 2 3; do
            if timeout 240s ssh -n -o BatchMode=yes -o ConnectTimeout=15 prod-pub \
              "docker pull ghcr.io/christ-roy/veridian-analytics-engine:${IMAGE_TAG} && docker pull ghcr.io/christ-roy/veridian-analytics-bridge:${IMAGE_TAG}"; then
              PULLED=1
              break
            fi
            echo "pré-pull prod tentative $attempt/3 en échec"
            sleep $((attempt * 10))
          done
          [ -n "$PULLED" ] || { echo "::error::pré-pull prod impossible après 3 tentatives"; exit 1; }

          # (4) run -detach → Evaluation ID → DeploymentID → monitor CE déploiement.
          # Si failed → update{auto_revert} a déjà ramené la version saine.
          echo "== nomad job run -detach + monitor ciblé (image_tag=${IMAGE_TAG}) =="
          EVAL=$(/usr/bin/nomad job run -detach "${RUN_INDEX_ARGS[@]}" \
            -var "image_tag=${IMAGE_TAG}" "$REMOTE_HCL" \
            | grep -oP 'Evaluation ID:\s+\K\S+')
          echo "eval: ${EVAL:-none}"
          DEP=""
          for i in $(seq 1 15); do
            DEP=$(/usr/bin/nomad eval status -json "$EVAL" 2>/dev/null | python3 -c 'import sys,json;print(json.load(sys.stdin).get("DeploymentID") or "")' 2>/dev/null || true)
            [ -n "$DEP" ] && break
            sleep 2
          done
          if [ -z "$DEP" ]; then
            echo "Pas de déploiement créé (job inchangé = no-op) → OK"
          else
            echo "deployment: $DEP — monitoring jusqu'à terminal…"
            /usr/bin/nomad deployment status -monitor "$DEP"
          fi
          REMOTE

      - name: Cleanup remote HCL
        if: always()
        run: |
          ssh -i ~/.ssh/id_ed25519 \
            "${{ secrets.NOMAD_BASTION_USER }}@${{ secrets.NOMAD_BASTION_HOST }}" \
            "rm -f '$REMOTE_HCL'" || true

      - name: Cleanup secrets
        if: always()
        run: rm -f ~/.ssh/id_ed25519 ~/.ssh/known_hosts

  # ─── Étage 3 : Smoke E2E prod ─────────────────────────────────────
  e2e-prod-smoke:
    name: Playwright smoke prod
    needs: deploy-prod
    # if explicite — même raison que trivy/deploy (chaîne avec
    # structural-gate skippable sur workflow_dispatch).
    if: ${{ !cancelled() && needs.deploy-prod.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ENGINE_URL: https://analytics-engine.app.veridian.site
      BRIDGE_URL: https://analytics-engine-bridge.app.veridian.site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install bridge deps
        working-directory: veridian-bridge
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi
      - name: Install Playwright chromium
        working-directory: veridian-bridge
        run: npx playwright install --with-deps chromium
      - name: Run smoke E2E
        working-directory: veridian-bridge
        run: npx playwright test tests/e2e/smoke/ --reporter=list
      - name: Upload trace on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-prod-smoke-trace
          path: veridian-bridge/test-results/
          retention-days: 7
