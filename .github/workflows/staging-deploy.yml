# Veridian Analytics Engine — CI/CD staging (durcie phase 2)
#
# Aligné CI-ARCHITECTURE.md analytics-engine (et inspiré de veridian-hub).
#
# 5 étages :
#   1. quick-checks            ~3min  lint + typecheck + tests bridge/sdk + static audit
#   1.b upstream-api-tests     ~12min Jest API + ClickHouse réel
#   1.c upstream-sdk-tests     ~5min  Vitest unit SDK
#   1.d trivy-fs               ~3min  scan filesystem (vuln+misconfig+secret)
#   1.e audit-bridge           ~3min  npm audit --omit=dev --audit-level=high
#   1.f integration-tests      ~6min  tests bridge contre Postgres+ClickHouse réels
#   2.  build                  ~6min  build engine + bridge → GHCR + Trivy image (bridge bloquant)
#   3.  deploy-staging         ~5min  SSH dev-pub + compose pull + up + smoke (via SSH)
#   4.  e2e-staging-smoke      ~3min  smoke applicatif + assertions contenu (via SSH)
#   5.  rollback-staging       (only on failure) — retag :rollback + redeploy (via SSH)
#
# NB smoke : staging est derrière Tailscale (`*.staging.veridian.site` →
# IP tailnet). Les runners GitHub ne sont pas sur le tailnet → tout smoke
# post-deploy s'exécute DANS dev-pub via SSH (docker compose ps + exec),
# jamais en `curl` runner→URL publique. Cf. commentaires étages 3/4/5.

name: Staging CI/CD

on:
  push:
    branches: [staging]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'releases/**'
      - 'TODO.md'
      - 'todo/**'
  pull_request:
    branches: [staging]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'releases/**'
      - 'TODO.md'
      - 'todo/**'
  workflow_dispatch:

concurrency:
  group: analytics-engine-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write
  security-events: write

env:
  REGISTRY: ghcr.io
  ENGINE_IMAGE: christ-roy/veridian-analytics-engine
  BRIDGE_IMAGE: christ-roy/veridian-analytics-bridge

jobs:
  # ─── Étage 1 : Quick checks ──────────────────────────────────────
  quick-checks:
    name: Étage 1 — Quick checks
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            api/package-lock.json
            veridian-bridge/package-lock.json
            sdk/package-lock.json

      - name: Install tooling
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck yamllint

      - name: Lint YAML
        run: |
          yamllint -d "{rules: {line-length: {max: 200}, document-start: disable, truthy: disable, comments-indentation: disable}}" \
            compose/*.yml \
            .github/workflows/*.yml

      - name: Shellcheck scripts CI
        run: |
          shellcheck -x scripts/ci/*.sh || echo "::warning::shellcheck issues — voir log"

      - name: Compose config check (staging)
        env:
          CLICKHOUSE_PASSWORD: ci-clickhouse-pass
          ENCRYPTION_KEY: ci-encryption-key-32-chars-minimum
          STAMINADS_ADMIN_PASSWORD: ci-staminads-pass
          VERIDIAN_ADMIN_API_KEY: ci-veridian-admin-key-32-chars-min
          # M2M admin platform (PlatformAdminGuard) : ${VAR:?} dans compose/base.yml.
          PLATFORM_ADMIN_API_KEY: ci-platform-admin-key-placeholder
          # Postgres bridge (A4) : ${VAR:?} dans postgres-bridge
          BRIDGE_DB_USER: ci-bridge-user
          BRIDGE_DB_PASSWORD: ci-bridge-password
          # HMAC Hub↔bridge : ${VAR:?} dans compose/base.yml.
          HUB_HMAC_SECRET: ci-hub-hmac-secret-32-chars-minimum
          # Clés VAPID Web Push (B2) : ${VAR:?} dans compose/base.yml.
          # Placeholders — c'est un `config -q`, pas un run réel.
          VAPID_PUBLIC_KEY: ci-vapid-public-key-placeholder
          VAPID_PRIVATE_KEY: ci-vapid-private-key-placeholder
          VAPID_SUBJECT: mailto:ci@veridian.site
        run: |
          docker compose -f compose/base.yml -f compose/staging.yml config -q
          echo "compose: ✓"

      - name: Bridge — install + typecheck + tests
        working-directory: veridian-bridge
        run: |
          npm ci --no-audit --no-fund
          npx tsc --noEmit
          npm run test:ci

      - name: Static audit (eval/exec/secrets)
        env:
          BASE_REF: origin/${{ github.base_ref || 'staging' }}
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            export BASE_REF="HEAD~1"
          fi
          ./scripts/ci/static-audit.sh

      - name: ENV sync (process.env ↔ .env.example)
        run: ./scripts/ci/check-env-sync.sh

      - name: Test mapping (route↔test)
        env:
          BASE_REF: origin/${{ github.base_ref || 'staging' }}
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            export BASE_REF="HEAD~1"
          fi
          ./scripts/ci/check-test-mapping.sh

  # ─── Étage 1.b : Tests upstream API (Jest + ClickHouse) ───────────
  upstream-api-tests:
    name: Étage 1.b — Tests Jest API (upstream + patches Veridian)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      clickhouse:
        image: clickhouse/clickhouse-server:24.8
        ports:
          - 8123:8123
          - 9000:9000
        env:
          CLICKHOUSE_USER: default
          CLICKHOUSE_PASSWORD: ""
          CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
        options: >-
          --health-cmd "wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: ./api
    env:
      CLICKHOUSE_HOST: http://localhost:8123
      CLICKHOUSE_DATABASE: staminads_test
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ""
      ADMIN_EMAIL: super-admin@test.com
      ADMIN_PASSWORD: testpass
      ENCRYPTION_KEY: test-encryption-key-32-chars-ok!
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: api/package-lock.json
      - name: npm ci
        run: npm ci
      - name: Tests unitaires Jest (avec coverage)
        run: npm run test:cov
      - name: Attente ClickHouse healthy
        run: |
          for i in {1..30}; do
            if curl -sf http://localhost:8123/ping; then
              echo "ClickHouse ready"
              break
            fi
            echo "Waiting for ClickHouse..."
            sleep 2
          done
          curl -sf http://localhost:8123/ping || (echo "ClickHouse KO" && exit 1)
      - name: Tests e2e Jest contre ClickHouse réel
        run: npm run test:e2e:cov
      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-coverage
          path: api/coverage*/
          retention-days: 14

  # ─── Étage 1.c : Tests SDK (Vitest unit) ──────────────────────────
  upstream-sdk-tests:
    name: Étage 1.c — Tests SDK (Vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: ./sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: sdk/package-lock.json
      - name: npm ci
        run: npm ci
      - name: Build SDK
        run: npm run build
      - name: Tests unitaires SDK (vitest)
        run: npm test

  # ─── Étage 1.f : Tests d'INTÉGRATION bridge (Postgres + ClickHouse réels) ──
  #
  # Doublure des chemins critiques du bridge contre de VRAIS services (cf
  # ticket T-INTEGRATION-TESTS). Les `*.test.ts` tournent contre des fakes
  # in-memory (rapides, pre-push) ; les `*.integration.test.ts` tournent ICI
  # contre un vrai Postgres 16 + ClickHouse 24.8 — seul moyen de valider les
  # contraintes SQL, erreurs P2002, cascades FK, transactions.
  #
  # Bloquant. Placé après quick-checks, gate du build (cf `needs:` du job build).
  # Le pattern `services:` ClickHouse est copié de l'étage 1.b upstream-api-tests.
  integration-tests:
    name: Étage 1.f — Tests intégration bridge (services réels)
    needs: quick-checks
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16
        ports:
          - 5432:5432
        env:
          POSTGRES_DB: veridian_bridge_test
          POSTGRES_USER: bridge_test
          POSTGRES_PASSWORD: bridge_test_pwd
        options: >-
          --health-cmd "pg_isready -U bridge_test -d veridian_bridge_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      clickhouse:
        image: clickhouse/clickhouse-server:24.8
        ports:
          - 8123:8123
          - 9000:9000
        env:
          CLICKHOUSE_USER: default
          CLICKHOUSE_PASSWORD: ""
          CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
        options: >-
          --health-cmd "wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      # Coordonnées lues par le harness tests/integration/_harness/index.ts.
      BRIDGE_TEST_DATABASE_URL: postgresql://bridge_test:bridge_test_pwd@localhost:5432/veridian_bridge_test
      CLICKHOUSE_TEST_HOST: http://localhost:8123
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: veridian-bridge/package-lock.json
      - name: Bridge — install
        working-directory: veridian-bridge
        run: npm ci --no-audit --no-fund
      - name: Prisma — generate client + migrate deploy
        working-directory: veridian-bridge
        env:
          BRIDGE_DATABASE_URL: postgresql://bridge_test:bridge_test_pwd@localhost:5432/veridian_bridge_test
        run: |
          npx prisma generate --schema=./prisma/schema.prisma
          npx prisma migrate deploy --schema=./prisma/schema.prisma
      - name: Tests d'intégration (Postgres + ClickHouse réels)
        working-directory: veridian-bridge
        run: npm run test:integration

  # ─── Étage 1.d : Trivy FS scan (warn-only, upstream noise) ───────
  trivy-fs:
    name: Étage 1.d — Trivy FS (warn-only)
    permissions:
      contents: read
      security-events: write
    uses: ./.github/workflows/_trivy-fs.yml
    with:
      scan-path: '.'
      severity: 'CRITICAL,HIGH'
      ignore-unfixed: true
      skip-license: true
      sarif-upload: true
      continue-on-error: true

  # ─── Étage 1.e : CVE audit bridge (bloquant) ──────────────────────
  audit-bridge:
    name: Étage 1.e — CVE audit bridge
    uses: ./.github/workflows/_audit-cve.yml
    with:
      app-path: veridian-bridge
      node-version: "22"
      omit-dev: true
      level: "high"

  # ─── Étage 1.g : Tests console Veridian (Vitest + RTL) ────────────
  #
  # La console embarque les composants/pages Veridian (dashboard, tabs,
  # welcome, auth-shell, error-pages) sous `console/src/veridian/**`, testés
  # par `console/vitest.config.ts` (scopé strictement sur ce dossier — pas
  # de Tailwind ni TanStack Router à monter). Sans ce job, ces suites
  # n'étaient validées que par le pre-push local. Le build (étage 2) ne
  # vérifie que la compilation TS, pas les assertions de comportement.
  console-checks:
    name: Étage 1.g — Tests console Veridian (Vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: ./console
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: console/package-lock.json
      - name: npm ci
        run: npm ci --no-audit --no-fund
      - name: Vitest (console/src/veridian)
        run: npm run test

  # ─── Étage 2 : Build images ───────────────────────────────────────
  build:
    name: Étage 2 — Build images
    needs: [quick-checks, upstream-api-tests, upstream-sdk-tests, integration-tests, audit-bridge, console-checks]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
      security-events: write
    outputs:
      engine_tag: ${{ steps.tag.outputs.engine_tag }}
      bridge_tag: ${{ steps.tag.outputs.bridge_tag }}
    steps:
      - uses: actions/checkout@v4

      - id: tag
        run: |
          SHA=${GITHUB_SHA:0:7}
          BRANCH=${GITHUB_REF##*/}
          if [[ "$BRANCH" == "staging" ]]; then
            PREFIX="staging"
          else
            PREFIX="veridian"
          fi
          {
            echo "engine_tag=${PREFIX}-${SHA}"
            echo "bridge_tag=${PREFIX}-${SHA}"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag current images as :rollback (pre-deploy)
        # Best-effort : on tag les latest existants comme :rollback pour
        # pouvoir revenir en arrière depuis le job rollback-staging.
        # Non bloquant si l'image n'existe pas encore (premier deploy).
        continue-on-error: true
        run: |
          for img in "${{ env.ENGINE_IMAGE }}" "${{ env.BRIDGE_IMAGE }}"; do
            TAG_SUFFIX="${GITHUB_REF##*/}-latest"
            docker pull "${{ env.REGISTRY }}/${img}:${TAG_SUFFIX}" 2>/dev/null && \
              docker tag "${{ env.REGISTRY }}/${img}:${TAG_SUFFIX}" "${{ env.REGISTRY }}/${img}:rollback" && \
              docker push "${{ env.REGISTRY }}/${img}:rollback" || true
          done

      - name: Build + push engine image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.ENGINE_IMAGE }}:${{ steps.tag.outputs.engine_tag }}
            ${{ env.REGISTRY }}/${{ env.ENGINE_IMAGE }}:${{ github.ref_name == 'staging' && 'staging-latest' || 'veridian-latest' }}
          cache-from: type=gha,scope=engine
          cache-to: type=gha,scope=engine,mode=max

      - name: Build + push bridge image
        uses: docker/build-push-action@v5
        with:
          context: veridian-bridge
          file: veridian-bridge/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.BRIDGE_IMAGE }}:${{ steps.tag.outputs.bridge_tag }}
            ${{ env.REGISTRY }}/${{ env.BRIDGE_IMAGE }}:${{ github.ref_name == 'staging' && 'staging-latest' || 'veridian-latest' }}
          cache-from: type=gha,scope=bridge
          cache-to: type=gha,scope=bridge,mode=max

      # Engine = upstream staminads. WARN-ONLY (continue-on-error). On suit
      # les CVE upstream sans bloquer un release Veridian — l'équipe upstream
      # corrige à son rythme.
      - name: Trivy image scan — engine (warn-only)
        uses: aquasecurity/trivy-action@v0.36.0
        continue-on-error: true
        with:
          scan-type: 'image'
          image-ref: '${{ env.REGISTRY }}/${{ env.ENGINE_IMAGE }}:${{ steps.tag.outputs.engine_tag }}'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          exit-code: '0'
          format: 'table'

      # Bridge = code Veridian. BLOQUANT.
      - name: Trivy image scan — bridge (bloquant)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'image'
          image-ref: '${{ env.REGISTRY }}/${{ env.BRIDGE_IMAGE }}:${{ steps.tag.outputs.bridge_tag }}'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          exit-code: '1'
          format: 'table'
          trivyignores: 'veridian-bridge/.trivyignore'

  # ─── Étage 3 : Deploy staging ─────────────────────────────────────
  deploy-staging:
    name: Étage 3 — Deploy staging
    needs: build
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    # 18 min : `compose pull` de 4 images sur le dev-pub (7.6 Go RAM) + up
    # des containers + smoke polling (jusqu'à 30×10s engine + 12×10s bridge)
    # dépassait régulièrement l'ancien cap de 10 min → job tué pendant le
    # smoke alors que le deploy lui-même était OK. Marge confortable ici.
    timeout-minutes: 18
    environment:
      name: staging
      url: https://analytics-engine.staging.veridian.site
    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H 37.187.199.185 >> ~/.ssh/known_hosts 2>/dev/null

      - name: Sync compose to dev-pub
        run: |
          ssh -i ~/.ssh/deploy_key staging-deploy@37.187.199.185 \
            'mkdir -p /opt/staging/analytics-engine/compose'
          scp -i ~/.ssh/deploy_key compose/base.yml compose/staging.yml \
            staging-deploy@37.187.199.185:/opt/staging/analytics-engine/compose/
          scp -i ~/.ssh/deploy_key clickhouse-users.xml \
            staging-deploy@37.187.199.185:/opt/staging/analytics-engine/

      - name: Write .env on dev-pub
        env:
          ENGINE_TAG: ${{ needs.build.outputs.engine_tag }}
          BRIDGE_TAG: ${{ needs.build.outputs.bridge_tag }}
          CLICKHOUSE_PASSWORD: ${{ secrets.CLICKHOUSE_PASSWORD_STAGING }}
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY_STAGING }}
          STAMINADS_ADMIN_PASSWORD: ${{ secrets.STAMINADS_ADMIN_PASSWORD_STAGING }}
          VERIDIAN_ADMIN_API_KEY: ${{ secrets.VERIDIAN_ADMIN_API_KEY_STAGING }}
          HUB_HMAC_SECRET: ${{ secrets.HUB_HMAC_SECRET_ANALYTICS_STAGING }}
          BRIDGE_DB_PASSWORD: ${{ secrets.BRIDGE_DB_PASSWORD_STAGING }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY_STAGING }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY_STAGING }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT_STAGING }}
          # Clé AES-256-GCM (64 hex) — chiffrement at-rest des credentials
          # bridge : tokens GSC (A4) + credentials VoIP self-service (U8).
          # Sans elle, les features Settings/credentials se désactivent
          # proprement (graceful degradation) — mais restent inertes.
          TOKEN_ENCRYPTION_KEY: ${{ secrets.TOKEN_ENCRYPTION_KEY_STAGING }}
        run: |
          ssh -i ~/.ssh/deploy_key staging-deploy@37.187.199.185 \
            "cat > /opt/staging/analytics-engine/.env <<ENV
          ENGINE_IMAGE_TAG=${ENGINE_TAG}
          BRIDGE_IMAGE_TAG=${BRIDGE_TAG}
          NODE_ENV=production
          CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD}
          ENCRYPTION_KEY=${ENCRYPTION_KEY}
          STAMINADS_ADMIN_EMAIL=admin@veridian.site
          STAMINADS_ADMIN_PASSWORD=${STAMINADS_ADMIN_PASSWORD}
          VERIDIAN_ADMIN_API_KEY=${VERIDIAN_ADMIN_API_KEY}
          HUB_HMAC_SECRET=${HUB_HMAC_SECRET}
          SKIP_HMAC=false
          BRIDGE_DB_USER=bridge
          BRIDGE_DB_PASSWORD=${BRIDGE_DB_PASSWORD}
          BRIDGE_DB_NAME=veridian_bridge
          VAPID_PUBLIC_KEY=${VAPID_PUBLIC_KEY}
          VAPID_PRIVATE_KEY=${VAPID_PRIVATE_KEY}
          VAPID_SUBJECT=${VAPID_SUBJECT}
          TOKEN_ENCRYPTION_KEY=${TOKEN_ENCRYPTION_KEY}
          ENV
          chmod 600 /opt/staging/analytics-engine/.env"

      - name: Deploy stack
        run: |
          ssh -i ~/.ssh/deploy_key staging-deploy@37.187.199.185 bash -s <<'DEPLOY'
            set -e
            cd /opt/staging/analytics-engine
            docker compose --env-file .env -f compose/base.yml -f compose/staging.yml pull
            # down scopé au project 'analytics-engine-staging' avant le up :
            # dégage les containers du run précédent. Scopé staging — ne
            # touche pas analytics-engine-dev (project name distinct).
            # Évite le conflit "container name already in use" sur orphelin.
            docker compose -p analytics-engine-staging --env-file .env -f compose/base.yml -f compose/staging.yml down --remove-orphans || true
            docker compose -p analytics-engine-staging --env-file .env -f compose/base.yml -f compose/staging.yml up -d --remove-orphans
            docker compose -p analytics-engine-staging --env-file .env -f compose/base.yml -f compose/staging.yml ps
          DEPLOY

      # Smoke EXÉCUTÉ SUR dev-pub via SSH — pas depuis le runner GitHub.
      #
      # Pourquoi : `*.staging.veridian.site` résout sur une IP Tailscale
      # (100.64.0.0/10), volontairement (cf. veridian-platform/CLAUDE.md —
      # staging derrière Tailscale). Les runners GitHub ne sont PAS sur le
      # tailnet → un `curl` runner→URL publique pend indéfiniment OU échoue
      # (même avec --max-time) ; le job se faisait tuer/annuler pendant le
      # smoke alors que le deploy lui-même était OK.
      #
      # Le smoke tourne donc DANS dev-pub, qui atteint les containers
      # directement (réseau Docker) — indépendant de Tailscale/Traefik/DNS :
      #   1. `docker compose ps` : tous les services en état `healthy`
      #   2. HTTP réel via `docker exec` : engine /api/setup.status + bridge /health
      - name: Smoke test (engine + bridge) — via SSH sur dev-pub
        timeout-minutes: 7
        run: |
          ssh -i ~/.ssh/deploy_key staging-deploy@37.187.199.185 bash -s <<'SMOKE'
            set -e
            cd /opt/staging/analytics-engine
            COMPOSE="docker compose -p analytics-engine-staging --env-file .env -f compose/base.yml -f compose/staging.yml"

            echo "── Attente containers healthy (max 5 min) ──"
            for i in $(seq 1 30); do
              UNHEALTHY=$($COMPOSE ps --format '{{.Name}} {{.Health}}' 2>/dev/null \
                | awk '$2 != "" && $2 != "healthy" {print}')
              if [ -z "$UNHEALTHY" ]; then
                echo "✓ tous les containers healthy après ${i}0s"
                break
              fi
              echo "  pas encore : $UNHEALTHY"
              sleep 10
            done
            UNHEALTHY=$($COMPOSE ps --format '{{.Name}} {{.Health}}' 2>/dev/null \
              | awk '$2 != "" && $2 != "healthy" {print}')
            if [ -n "$UNHEALTHY" ]; then
              echo "::error::Containers non-healthy : $UNHEALTHY"
              $COMPOSE ps
              exit 1
            fi

            echo "── Smoke HTTP engine (docker exec, port interne 3000) ──"
            $COMPOSE exec -T engine wget -q -O- http://127.0.0.1:3000/api/setup.status >/dev/null \
              && echo "✓ engine /api/setup.status OK" \
              || { echo "::error::engine KO"; exit 1; }

            echo "── Smoke HTTP bridge (docker exec, port interne 3002) ──"
            $COMPOSE exec -T bridge wget -q -O- http://127.0.0.1:3002/health >/dev/null \
              && echo "✓ bridge /health OK" \
              || { echo "::error::bridge KO"; exit 1; }

            echo "Staging deploy : ✓ smoke OK"
          SMOKE

      - name: Cleanup secrets
        if: always()
        run: |
          rm -f ~/.ssh/deploy_key ~/.ssh/known_hosts

  # ─── Étage 4 : Smoke applicatif post-deploy (via SSH dev-pub) ─────
  #
  # Anciennement "Playwright smoke contre URL staging publique". Mais
  # `*.staging.veridian.site` est sur le tailnet (IP Tailscale) — un
  # runner GitHub ne peut PAS l'atteindre (cf. note étage 3). On exécute
  # donc le smoke applicatif DANS dev-pub via SSH : check HTTP réel +
  # assertions de contenu sur les endpoints publics du bridge et de
  # l'engine. Pas de navigateur — les smokes Playwright actuels ne sont
  # que des `fetch()` sur /health, parfaitement reproductibles en wget.
  #
  # NB : un vrai E2E navigateur contre staging nécessiterait de mettre le
  # runner sur le tailnet (action tailscale/github-action + secret
  # TS_OAUTH). Suivi séparé — cf. todo INFRA.
  e2e-staging-smoke:
    name: Étage 4 — Smoke applicatif staging
    needs: deploy-staging
    if: github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H 37.187.199.185 >> ~/.ssh/known_hosts 2>/dev/null

      - name: Smoke applicatif (assertions de contenu) — via SSH
        run: |
          ssh -i ~/.ssh/deploy_key staging-deploy@37.187.199.185 bash -s <<'E2E'
            set -e
            cd /opt/staging/analytics-engine
            COMPOSE="docker compose -p analytics-engine-staging --env-file .env -f compose/base.yml -f compose/staging.yml"

            echo "── Bridge /health → status:ok ──"
            BODY=$($COMPOSE exec -T bridge wget -q -O- http://127.0.0.1:3002/health)
            echo "  réponse : $BODY"
            echo "$BODY" | grep -q '"status":"ok"' \
              || { echo "::error::bridge /health sans status:ok"; exit 1; }

            echo "── Engine /api/setup.status → réponse JSON ──"
            STATUS=$($COMPOSE exec -T engine wget -q -O- http://127.0.0.1:3000/api/setup.status)
            echo "  réponse : $STATUS"
            echo "$STATUS" | grep -q '{' \
              || { echo "::error::engine /api/setup.status sans corps JSON"; exit 1; }

            echo "Smoke applicatif staging : ✓ OK"
          E2E

      - name: Cleanup secrets
        if: always()
        run: rm -f ~/.ssh/deploy_key ~/.ssh/known_hosts

  # ─── Étage 5 : Rollback auto si smoke fail ────────────────────────
  rollback-staging:
    name: Étage 5 — Rollback staging (auto on failure)
    needs: [build, deploy-staging, e2e-staging-smoke]
    if: |
      always() &&
      github.ref == 'refs/heads/staging' &&
      (needs.deploy-staging.result == 'failure' || needs.e2e-staging-smoke.result == 'failure')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Setup SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H 37.187.199.185 >> ~/.ssh/known_hosts 2>/dev/null
      # Rollback + vérif healthy : tout est exécuté DANS dev-pub via SSH.
      # Le `curl` runner→URL publique ne marche pas (staging sur tailnet,
      # cf. note étage 3) — on vérifie le healthcheck container localement.
      - name: Rollback to :rollback image
        run: |
          ssh -i ~/.ssh/deploy_key staging-deploy@37.187.199.185 bash -s <<'ROLLBACK'
            set -e
            cd /opt/staging/analytics-engine
            COMPOSE="docker compose -p analytics-engine-staging --env-file .env -f compose/base.yml -f compose/staging.yml"
            # On force ENGINE_IMAGE_TAG=rollback et BRIDGE_IMAGE_TAG=rollback
            # dans le .env, puis redeploy.
            sed -i 's|^ENGINE_IMAGE_TAG=.*|ENGINE_IMAGE_TAG=rollback|' .env
            sed -i 's|^BRIDGE_IMAGE_TAG=.*|BRIDGE_IMAGE_TAG=rollback|' .env
            docker compose --env-file .env -f compose/base.yml -f compose/staging.yml pull
            $COMPOSE up -d --remove-orphans
            echo "✓ Rollback déclenché"

            echo "── Vérif healthy post-rollback (max 3 min) ──"
            for i in $(seq 1 18); do
              UNHEALTHY=$($COMPOSE ps --format '{{.Name}} {{.Health}}' 2>/dev/null \
                | awk '$2 != "" && $2 != "healthy" {print}')
              if [ -z "$UNHEALTHY" ]; then
                echo "✓ Rollback healthy après $((i*10))s"
                exit 0
              fi
              sleep 10
            done
            echo "::error::Rollback non confirmé après 180s — intervention manuelle requise"
            $COMPOSE ps
            exit 1
          ROLLBACK
      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/deploy_key ~/.ssh/known_hosts
