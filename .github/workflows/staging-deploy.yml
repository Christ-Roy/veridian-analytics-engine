# Veridian Analytics Engine — CI/CD staging
# Aligné CI-ARCHITECTURE.md du polyrepo Veridian.
#
# 3 étages :
#   1. quick-checks        ubuntu-latest    ~90s    lint + test bridge + Trivy fs
#   2. build               ubuntu-latest    ~5min   build engine (staminads) + bridge → GHCR + Trivy image
#   3. deploy-staging      ubuntu-latest    ~2min   SSH dev-pub + compose pull + up -d + smoke

name: Staging CI/CD

on:
  push:
    branches: [staging, veridian/main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'releases/**'
      - 'TODO.md'
  pull_request:
    branches: [staging, veridian/main]
  workflow_dispatch:

concurrency:
  group: analytics-engine-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  ENGINE_IMAGE: christ-roy/veridian-analytics-engine
  BRIDGE_IMAGE: christ-roy/veridian-analytics-bridge

jobs:
  # ─── Étage 1 : Quick checks ────────────────────────────────────────
  quick-checks:
    name: Étage 1 — Quick checks
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            api/package-lock.json
            veridian-bridge/package-lock.json

      - name: Install tooling
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck yamllint

      - name: Lint YAML
        run: |
          yamllint -d "{rules: {line-length: {max: 200}, document-start: disable, truthy: disable}}" \
            compose/*.yml \
            .github/workflows/*.yml

      - name: Compose config check (staging)
        env:
          CLICKHOUSE_PASSWORD: ci-clickhouse-pass
          ENCRYPTION_KEY: ci-encryption-key-32-chars-minimum
          STAMINADS_ADMIN_PASSWORD: ci-staminads-pass
          VERIDIAN_ADMIN_API_KEY: ci-veridian-admin-key-32-chars-min
        run: |
          docker compose -f compose/base.yml -f compose/staging.yml config -q
          echo "compose: ✓"

      - name: Bridge — install + typecheck + tests
        working-directory: veridian-bridge
        run: |
          npm install --no-audit --no-fund
          npx tsc --noEmit
          npm run test:ci

      # Trivy fs : capacités 1+2+3 (vuln + misconfig + secret).
      # Phase 1 : non bloquant (continue-on-error). Le code staminads upstream
      # contient des CVE/findings qu'on triera en Phase 6 (audit dédié) via VEX.
      # Le bridge Veridian est lui scanné séparément en étage 2 (bloquant).
      - name: Trivy fs scan (non bloquant Phase 1)
        uses: aquasecurity/trivy-action@v0.36.0
        continue-on-error: true
        with:
          scan-type: 'fs'
          scan-ref: '.'
          scanners: 'vuln,misconfig,secret'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          exit-code: '0'
          format: 'table'

  # ─── Étage 1.b : Tests upstream API (Jest + ClickHouse) ────────────
  # Reproduction exacte de .github/workflows/test.yml upstream staminads,
  # adapté à notre branche staging. Bloquant : si tests upstream cassés,
  # on ne build pas une image qui contiendrait du code régressé.
  upstream-api-tests:
    name: Étage 1.b — Tests Jest API (upstream + futurs patches Veridian)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    services:
      clickhouse:
        image: clickhouse/clickhouse-server:24.8
        ports:
          - 8123:8123
          - 9000:9000
        env:
          CLICKHOUSE_USER: default
          CLICKHOUSE_PASSWORD: ""
          CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
        options: >-
          --health-cmd "wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: ./api
    env:
      CLICKHOUSE_HOST: http://localhost:8123
      CLICKHOUSE_DATABASE: staminads_test
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ""
      ADMIN_EMAIL: super-admin@test.com
      ADMIN_PASSWORD: testpass
      ENCRYPTION_KEY: test-encryption-key-32-chars-ok!
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: api/package-lock.json
      - name: npm ci
        run: npm ci
      - name: Tests unitaires Jest (avec coverage)
        run: npm run test:cov
      - name: Attente ClickHouse healthy
        run: |
          for i in {1..30}; do
            if curl -sf http://localhost:8123/ping; then
              echo "ClickHouse ready"
              break
            fi
            echo "Waiting for ClickHouse..."
            sleep 2
          done
          curl -sf http://localhost:8123/ping || (echo "ClickHouse KO" && exit 1)
      - name: Tests e2e Jest contre ClickHouse réel
        run: npm run test:e2e:cov
      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-coverage
          path: api/coverage*/
          retention-days: 14

  # ─── Étage 1.c : Tests SDK (Vitest unit) ───────────────────────────
  # Le SDK tracker JS a 2 suites : vitest (unit, sans dépendance externe)
  # et playwright e2e (qui exige API NestJS + ClickHouse + static server
  # tous up). Vitest = bloquant ici. Playwright e2e = job séparé optionnel
  # car nécessite un environnement complet (ajouté plus tard).
  upstream-sdk-tests:
    name: Étage 1.c — Tests SDK (Vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ./sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: sdk/package-lock.json
      - name: npm ci
        run: npm ci
      # Build d'abord : certains tests vérifient que dist/ existe et que
      # la version SDK_VERSION a bien été injectée dans le bundle.
      - name: Build SDK
        run: npm run build
      - name: Tests unitaires SDK (vitest)
        run: npm test

  # ─── Étage 2 : Build images ────────────────────────────────────────
  build:
    name: Étage 2 — Build images
    needs: [quick-checks, upstream-api-tests, upstream-sdk-tests]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    outputs:
      engine_tag: ${{ steps.tag.outputs.engine_tag }}
      bridge_tag: ${{ steps.tag.outputs.bridge_tag }}
    steps:
      - uses: actions/checkout@v4

      - id: tag
        run: |
          SHA=${GITHUB_SHA:0:7}
          BRANCH=${GITHUB_REF##*/}
          if [[ "$BRANCH" == "staging" ]]; then
            PREFIX="staging"
          else
            PREFIX="veridian"
          fi
          echo "engine_tag=${PREFIX}-${SHA}" >> $GITHUB_OUTPUT
          echo "bridge_tag=${PREFIX}-${SHA}" >> $GITHUB_OUTPUT

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ── Build engine (staminads upstream + patches Veridian) ─────
      - name: Build + push engine image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.ENGINE_IMAGE }}:${{ steps.tag.outputs.engine_tag }}
            ${{ env.REGISTRY }}/${{ env.ENGINE_IMAGE }}:${{ github.ref_name == 'staging' && 'staging-latest' || 'veridian-latest' }}
          cache-from: type=gha,scope=engine
          cache-to: type=gha,scope=engine,mode=max

      # ── Build bridge Veridian ────────────────────────────────────
      - name: Build + push bridge image
        uses: docker/build-push-action@v5
        with:
          context: veridian-bridge
          file: veridian-bridge/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.BRIDGE_IMAGE }}:${{ steps.tag.outputs.bridge_tag }}
            ${{ env.REGISTRY }}/${{ env.BRIDGE_IMAGE }}:${{ github.ref_name == 'staging' && 'staging-latest' || 'veridian-latest' }}
          cache-from: type=gha,scope=bridge
          cache-to: type=gha,scope=bridge,mode=max

      # ── Trivy image scan (cap 5+6+7+8) ───────────────────────────
      - name: Trivy image scan — engine (Phase 1 non bloquant)
        uses: aquasecurity/trivy-action@v0.36.0
        continue-on-error: true
        with:
          scan-type: 'image'
          image-ref: '${{ env.REGISTRY }}/${{ env.ENGINE_IMAGE }}:${{ steps.tag.outputs.engine_tag }}'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          exit-code: '0'
          format: 'table'

      - name: Trivy image scan — bridge (bloquant)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'image'
          image-ref: '${{ env.REGISTRY }}/${{ env.BRIDGE_IMAGE }}:${{ steps.tag.outputs.bridge_tag }}'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          exit-code: '1'
          format: 'table'
          trivyignores: 'veridian-bridge/.trivyignore'

  # ─── Étage 3 : Deploy staging via SSH dev-pub ──────────────────────
  deploy-staging:
    name: Étage 3 — Deploy staging
    needs: build
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: staging
      url: https://analytics-engine.staging.veridian.site
    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H 37.187.199.185 >> ~/.ssh/known_hosts 2>/dev/null

      - name: Sync compose to dev-pub
        run: |
          ssh -i ~/.ssh/deploy_key staging-deploy@37.187.199.185 \
            'mkdir -p /opt/staging/analytics-engine/compose'
          scp -i ~/.ssh/deploy_key compose/base.yml compose/staging.yml \
            staging-deploy@37.187.199.185:/opt/staging/analytics-engine/compose/
          scp -i ~/.ssh/deploy_key clickhouse-users.xml \
            staging-deploy@37.187.199.185:/opt/staging/analytics-engine/

      - name: Write .env on dev-pub
        env:
          ENGINE_TAG: ${{ needs.build.outputs.engine_tag }}
          BRIDGE_TAG: ${{ needs.build.outputs.bridge_tag }}
          CLICKHOUSE_PASSWORD: ${{ secrets.CLICKHOUSE_PASSWORD_STAGING }}
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY_STAGING }}
          STAMINADS_ADMIN_PASSWORD: ${{ secrets.STAMINADS_ADMIN_PASSWORD_STAGING }}
          VERIDIAN_ADMIN_API_KEY: ${{ secrets.VERIDIAN_ADMIN_API_KEY_STAGING }}
        run: |
          ssh -i ~/.ssh/deploy_key staging-deploy@37.187.199.185 \
            "cat > /opt/staging/analytics-engine/.env <<ENV
          ENGINE_IMAGE_TAG=${ENGINE_TAG}
          BRIDGE_IMAGE_TAG=${BRIDGE_TAG}
          CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD}
          ENCRYPTION_KEY=${ENCRYPTION_KEY}
          STAMINADS_ADMIN_EMAIL=admin@veridian.site
          STAMINADS_ADMIN_PASSWORD=${STAMINADS_ADMIN_PASSWORD}
          VERIDIAN_ADMIN_API_KEY=${VERIDIAN_ADMIN_API_KEY}
          ENV
          chmod 600 /opt/staging/analytics-engine/.env"

      - name: Deploy stack
        run: |
          ssh -i ~/.ssh/deploy_key staging-deploy@37.187.199.185 bash -s <<'DEPLOY'
            set -e
            cd /opt/staging/analytics-engine
            docker compose --env-file .env -f compose/base.yml -f compose/staging.yml pull
            docker compose --env-file .env -f compose/base.yml -f compose/staging.yml up -d --remove-orphans
            docker compose --env-file .env -f compose/base.yml -f compose/staging.yml ps
          DEPLOY

      - name: Smoke test (wait + curl)
        run: |
          echo "Waiting for staminads engine to be healthy..."
          for i in $(seq 1 30); do
            if curl -skf https://analytics-engine.staging.veridian.site/api/setup.status >/dev/null; then
              echo "✓ engine up after ${i}0s"
              break
            fi
            sleep 10
          done
          curl -skf https://analytics-engine.staging.veridian.site/api/setup.status || (echo "engine KO" && exit 1)
          echo "Waiting for bridge..."
          for i in $(seq 1 12); do
            if curl -skf https://analytics-engine-bridge.staging.veridian.site/health >/dev/null; then
              echo "✓ bridge up after ${i}0s"
              break
            fi
            sleep 10
          done
          curl -skf https://analytics-engine-bridge.staging.veridian.site/health || (echo "bridge KO" && exit 1)
          echo "Staging deploy : ✓ smoke OK"
