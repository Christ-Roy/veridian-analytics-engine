# Veridian Analytics Engine — CI/CD staging (durcie phase 2)
#
# Aligné CI-ARCHITECTURE.md analytics-engine (et inspiré de veridian-hub).
#
# 5 étages :
#   1. quick-checks            ~3min  lint + typecheck + tests bridge/sdk + static audit
#   1.b upstream-api-tests     ~12min Jest API + ClickHouse réel
#   1.c upstream-sdk-tests     ~5min  Vitest unit SDK
#   1.d trivy-fs               ~3min  scan filesystem (vuln+misconfig+secret)
#   1.e audit-bridge           ~3min  npm audit --omit=dev --audit-level=high
#   1.f integration-tests      ~6min  tests bridge contre Postgres+ClickHouse réels
#   2.  build                  ~6min  build engine + bridge → GHCR + Trivy image (bridge bloquant)
#   3.  deploy-staging         ~5min  GHCR + Nomad via bastion, placé sur ovh-dev
#   4.  e2e-staging-smoke      ~3min  assertions réelles via le tailnet du bastion
#
# NB smoke : staging est derrière Tailscale (`*.staging.veridian.site` →
# IP tailnet). Les runners GitHub ne sont pas sur le tailnet → tout smoke
# post-deploy s'exécute depuis le bastion Nomad dans le tailnet,
# jamais en `curl` runner→URL publique. Cf. commentaires étages 3/4.

name: Staging CI/CD

on:
  push:
    branches: [staging]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'releases/**'
      - 'TODO.md'
      - 'todo/**'
  pull_request:
    branches: [staging]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'releases/**'
      - 'TODO.md'
      - 'todo/**'
  workflow_dispatch:

concurrency:
  group: analytics-engine-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write
  security-events: write

env:
  REGISTRY: ghcr.io
  ENGINE_IMAGE: christ-roy/veridian-analytics-engine
  BRIDGE_IMAGE: christ-roy/veridian-analytics-bridge

jobs:
  # ─── Étage 1 : Quick checks ──────────────────────────────────────
  quick-checks:
    name: Étage 1 — Quick checks
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Invariants GitOps Nomad
        run: ./scripts/ci/check-nomad-gitops-reliability.sh

      - name: Plafonds ressources staging
        run: python3 scripts/ci/check-staging-resources.py

      - name: Rétention logs ClickHouse staging
        run: python3 scripts/ci/check-clickhouse-log-retention.py

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            api/package-lock.json
            veridian-bridge/package-lock.json
            sdk/package-lock.json

      - name: Install tooling
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck yamllint

      - name: Lint YAML
        run: |
          yamllint -d "{rules: {line-length: {max: 200}, document-start: disable, truthy: disable, comments-indentation: disable}}" \
            compose/*.yml \
            .github/workflows/*.yml

      - name: Shellcheck scripts CI
        run: |
          shellcheck -x scripts/ci/*.sh || echo "::warning::shellcheck issues — voir log"

      - name: Compose config check (staging)
        env:
          CLICKHOUSE_PASSWORD: ci-clickhouse-pass
          ENCRYPTION_KEY: ci-encryption-key-32-chars-minimum
          VERIDIAN_ADMIN_API_KEY: ci-veridian-admin-key-32-chars-min
          # M2M admin platform (PlatformAdminGuard) : ${VAR:?} dans compose/base.yml
          # sur les services engine ET bridge (remplace STAMINADS_ADMIN_PASSWORD).
          PLATFORM_ADMIN_API_KEY: ci-platform-admin-key-placeholder
          # Postgres bridge (A4) : ${VAR:?} dans postgres-bridge
          BRIDGE_DB_USER: ci-bridge-user
          BRIDGE_DB_PASSWORD: ci-bridge-password
          # HMAC Hub↔bridge : ${VAR:?} dans compose/base.yml.
          HUB_HMAC_SECRET: ci-hub-hmac-secret-32-chars-minimum
          # Clés VAPID Web Push (B2) : ${VAR:?} dans compose/base.yml.
          # Placeholders — c'est un `config -q`, pas un run réel.
          VAPID_PUBLIC_KEY: ci-vapid-public-key-placeholder
          VAPID_PRIVATE_KEY: ci-vapid-private-key-placeholder
          VAPID_SUBJECT: mailto:ci@veridian.site
        run: |
          docker compose -f compose/base.yml -f compose/staging.yml config -q
          echo "compose: ✓"

      - name: Bridge — install + typecheck + tests
        working-directory: veridian-bridge
        run: |
          npm ci --no-audit --no-fund
          npx tsc --noEmit
          npm run test:ci

      - name: Static audit (eval/exec/secrets)
        env:
          BASE_REF: origin/${{ github.base_ref || 'staging' }}
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            export BASE_REF="HEAD~1"
          fi
          ./scripts/ci/static-audit.sh

      - name: ENV sync (process.env ↔ .env.example)
        run: ./scripts/ci/check-env-sync.sh

      - name: Test mapping (route↔test)
        env:
          BASE_REF: origin/${{ github.base_ref || 'staging' }}
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            export BASE_REF="HEAD~1"
          fi
          ./scripts/ci/check-test-mapping.sh

  # ─── Étage 1.b : Tests upstream API (Jest + ClickHouse) ───────────
  upstream-api-tests:
    name: Étage 1.b — Tests Jest API (upstream + patches Veridian)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      clickhouse:
        image: clickhouse/clickhouse-server:24.8
        ports:
          - 8123:8123
          - 9000:9000
        env:
          CLICKHOUSE_USER: default
          CLICKHOUSE_PASSWORD: ""
          CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
        options: >-
          --health-cmd "wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: ./api
    env:
      CLICKHOUSE_HOST: http://localhost:8123
      CLICKHOUSE_DATABASE: staminads_test
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ""
      ADMIN_EMAIL: super-admin@test.com
      ADMIN_PASSWORD: testpass
      ENCRYPTION_KEY: test-encryption-key-32-chars-ok!
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: api/package-lock.json
      - name: npm ci
        run: npm ci
      - name: Tests unitaires Jest (avec coverage)
        run: npm run test:cov
      - name: Attente ClickHouse healthy
        run: |
          for i in {1..30}; do
            if curl -sf http://localhost:8123/ping; then
              echo "ClickHouse ready"
              break
            fi
            echo "Waiting for ClickHouse..."
            sleep 2
          done
          curl -sf http://localhost:8123/ping || (echo "ClickHouse KO" && exit 1)
      - name: Tests e2e Jest contre ClickHouse réel
        run: npm run test:e2e:cov
      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-coverage
          path: api/coverage*/
          retention-days: 14

  # ─── Étage 1.c : Tests SDK (Vitest unit) ──────────────────────────
  upstream-sdk-tests:
    name: Étage 1.c — Tests SDK (Vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: ./sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: sdk/package-lock.json
      - name: npm ci
        run: npm ci
      - name: Build SDK
        run: npm run build
      - name: Tests unitaires SDK (vitest)
        run: npm test

  # ─── Étage 1.f : Tests d'INTÉGRATION bridge (Postgres + ClickHouse réels) ──
  #
  # Doublure des chemins critiques du bridge contre de VRAIS services (cf
  # ticket T-INTEGRATION-TESTS). Les `*.test.ts` tournent contre des fakes
  # in-memory (rapides, pre-push) ; les `*.integration.test.ts` tournent ICI
  # contre un vrai Postgres 16 + ClickHouse 24.8 — seul moyen de valider les
  # contraintes SQL, erreurs P2002, cascades FK, transactions.
  #
  # Bloquant. Placé après quick-checks, gate du build (cf `needs:` du job build).
  # Le pattern `services:` ClickHouse est copié de l'étage 1.b upstream-api-tests.
  integration-tests:
    name: Étage 1.f — Tests intégration bridge (services réels)
    needs: quick-checks
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16
        ports:
          - 5432:5432
        env:
          POSTGRES_DB: veridian_bridge_test
          POSTGRES_USER: bridge_test
          POSTGRES_PASSWORD: bridge_test_pwd
        options: >-
          --health-cmd "pg_isready -U bridge_test -d veridian_bridge_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      clickhouse:
        image: clickhouse/clickhouse-server:24.8
        ports:
          - 8123:8123
          - 9000:9000
        env:
          CLICKHOUSE_USER: default
          CLICKHOUSE_PASSWORD: ""
          CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
        options: >-
          --health-cmd "wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      # Coordonnées lues par le harness tests/integration/_harness/index.ts.
      BRIDGE_TEST_DATABASE_URL: postgresql://bridge_test:bridge_test_pwd@localhost:5432/veridian_bridge_test
      CLICKHOUSE_TEST_HOST: http://localhost:8123
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: veridian-bridge/package-lock.json
      - name: Bridge — install
        working-directory: veridian-bridge
        run: npm ci --no-audit --no-fund
      - name: Prisma — generate client + migrate deploy
        working-directory: veridian-bridge
        env:
          BRIDGE_DATABASE_URL: postgresql://bridge_test:bridge_test_pwd@localhost:5432/veridian_bridge_test
        run: |
          npx prisma generate --schema=./prisma/schema.prisma
          npx prisma migrate deploy --schema=./prisma/schema.prisma
      - name: Tests d'intégration (Postgres + ClickHouse réels)
        working-directory: veridian-bridge
        run: npm run test:integration

  # ─── Étage 1.d : Trivy FS scan (warn-only, upstream noise) ───────
  trivy-fs:
    name: Étage 1.d — Trivy FS (warn-only)
    permissions:
      contents: read
      security-events: write
    uses: ./.github/workflows/_trivy-fs.yml
    with:
      scan-path: '.'
      severity: 'CRITICAL,HIGH'
      ignore-unfixed: true
      skip-license: true
      sarif-upload: true
      continue-on-error: true

  # ─── Étage 1.e : CVE audit bridge (bloquant) ──────────────────────
  audit-bridge:
    name: Étage 1.e — CVE audit bridge
    uses: ./.github/workflows/_audit-cve.yml
    with:
      app-path: veridian-bridge
      node-version: "22"
      omit-dev: true
      level: "high"

  # ─── Étage 1.g : Tests console (Vitest + RTL) ─────────────────────
  #
  # Couvre les composants/pages Veridian (`console/src/veridian/**`) ET, depuis
  # l'incident prod 2026-06-29, le code hérité staminax partagé : lib de
  # formatage (`src/lib`), widgets dashboard (`src/components`) et hooks
  # (`src/hooks`). Ce dernier élargissement est CRITIQUE : un crash
  # `undefined.toFixed()` dans un widget dashboard avait planté tous les
  # workspaces SANS qu'aucun test ne le voie (vitest était scopé strictement
  # sur src/veridian/**). Bloquant : `build` (étage 2) a ce job dans son
  # `needs:`, donc un test rouge empêche tout déploiement. Le build ne vérifie
  # que la compilation TS, pas les assertions de comportement.
  console-checks:
    name: Étage 1.g — Tests console (Vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: ./console
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: console/package-lock.json
      - name: npm ci
        run: npm ci --no-audit --no-fund
      - name: Vitest (console — veridian + lib + components + hooks)
        run: npm run test

  # ─── Étage 2 : Build images ───────────────────────────────────────
  build:
    name: Étage 2 — Build images
    needs: [quick-checks, upstream-api-tests, upstream-sdk-tests, integration-tests, audit-bridge, console-checks]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
      security-events: write
    outputs:
      engine_tag: ${{ steps.tag.outputs.engine_tag }}
      bridge_tag: ${{ steps.tag.outputs.bridge_tag }}
    steps:
      - uses: actions/checkout@v4

      - id: tag
        run: |
          SHA=${GITHUB_SHA:0:7}
          BRANCH=${GITHUB_REF##*/}
          if [[ "$BRANCH" == "staging" ]]; then
            PREFIX="staging"
          else
            PREFIX="veridian"
          fi
          {
            echo "engine_tag=${PREFIX}-${SHA}"
            echo "bridge_tag=${PREFIX}-${SHA}"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag current images as :rollback (pre-deploy)
        # Best-effort : on tag les latest existants comme :rollback pour
        # pouvoir revenir en arrière depuis le job rollback-staging.
        # Non bloquant si l'image n'existe pas encore (premier deploy).
        continue-on-error: true
        run: |
          for img in "${{ env.ENGINE_IMAGE }}" "${{ env.BRIDGE_IMAGE }}"; do
            TAG_SUFFIX="${GITHUB_REF##*/}-latest"
            docker pull "${{ env.REGISTRY }}/${img}:${TAG_SUFFIX}" 2>/dev/null && \
              docker tag "${{ env.REGISTRY }}/${img}:${TAG_SUFFIX}" "${{ env.REGISTRY }}/${img}:rollback" && \
              docker push "${{ env.REGISTRY }}/${img}:rollback" || true
          done

      - name: Build + push engine image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.ENGINE_IMAGE }}:${{ steps.tag.outputs.engine_tag }}
            ${{ env.REGISTRY }}/${{ env.ENGINE_IMAGE }}:${{ github.ref_name == 'staging' && 'staging-latest' || 'veridian-latest' }}
          cache-from: type=gha,scope=engine
          cache-to: type=gha,scope=engine,mode=max

      - name: Build + push bridge image
        uses: docker/build-push-action@v5
        with:
          context: veridian-bridge
          file: veridian-bridge/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.BRIDGE_IMAGE }}:${{ steps.tag.outputs.bridge_tag }}
            ${{ env.REGISTRY }}/${{ env.BRIDGE_IMAGE }}:${{ github.ref_name == 'staging' && 'staging-latest' || 'veridian-latest' }}
          cache-from: type=gha,scope=bridge
          cache-to: type=gha,scope=bridge,mode=max

      # Engine = upstream staminads. WARN-ONLY (continue-on-error). On suit
      # les CVE upstream sans bloquer un release Veridian — l'équipe upstream
      # corrige à son rythme.
      - name: Trivy image scan — engine (warn-only)
        uses: aquasecurity/trivy-action@v0.36.0
        continue-on-error: true
        with:
          scan-type: 'image'
          image-ref: '${{ env.REGISTRY }}/${{ env.ENGINE_IMAGE }}:${{ steps.tag.outputs.engine_tag }}'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          exit-code: '0'
          format: 'table'

      # Bridge = code Veridian. BLOQUANT.
      - name: Trivy image scan — bridge (bloquant)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'image'
          image-ref: '${{ env.REGISTRY }}/${{ env.BRIDGE_IMAGE }}:${{ steps.tag.outputs.bridge_tag }}'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          exit-code: '1'
          format: 'table'
          trivyignores: 'veridian-bridge/.trivyignore'

  # ─── Étage 3 : Deploy staging (Nomad via bastion) ─────────────────
  #
  # Remplace l'ancien deploy compose SSH→dev-pub par un `nomad job run` du HCL
  # versionné (deploy/analytics-engine-staging.nomad.hcl). La CI SSH vers le
  # bastion Nomad, y source le token IN SITU (jamais exposé au runner), et
  # `nomad job plan`→`run -detach -var image_tag=<staging-sha7>`. Rollback =
  # auto_revert du job (stanza `update`), pas de job CI dédié.
  deploy-staging:
    name: Étage 3 — Deploy staging (Nomad)
    needs: build
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: staging
      url: https://analytics-engine.staging.veridian.site
    env:
      IMAGE_TAG: ${{ needs.build.outputs.engine_tag }}
      JOB_FILE: deploy/analytics-engine-staging.nomad.hcl
      NOMAD_JOB: analytics-engine-staging
      REMOTE_HCL: /tmp/analytics-engine-staging-${{ github.run_id }}.nomad.hcl
    steps:
      - uses: actions/checkout@v4

      - name: Install SSH key (bastion Nomad)
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.NOMAD_DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          for attempt in 1 2 3; do
            if ssh-keyscan -T 15 -H "${{ secrets.NOMAD_BASTION_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null; then
              exit 0
            fi
            echo "ssh-keyscan tentative $attempt/3 en échec"
            sleep 3
          done
          echo "::error::impossible de récupérer la clé SSH du bastion"
          exit 1

      # Copie du HCL DU REPO (celui qui déclare `variable "image_tag"`), jamais
      # la copie ~/nomad-veridian/jobs/ du bastion (sans variable → -var échoue).
      - name: Copy HCL to bastion
        run: |
          scp -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=accept-new \
            "$JOB_FILE" \
            "${{ secrets.NOMAD_BASTION_USER }}@${{ secrets.NOMAD_BASTION_HOST }}:$REMOTE_HCL"

      # Pré-pull authentifié + deploy + monitoring CIBLÉ (canon prospection, ticket
      # NOMAD-GITOPS §4 pièges). Évite les 3 pièges : (2) Nomad ne pull pas ghcr
      # privé → pré-pull auth sur ovh-dev ; (3) `ssh -n` sinon le heredoc est avalé ;
      # (4) monitoring du DeploymentID EXACT (via Evaluation ID) et pas un poll
      # `job status | grep successful` (qui lit le déploiement PRÉCÉDENT = faux vert).
      - name: Pré-pull + nomad plan + run -detach + monitor ciblé
        run: |
          ssh -i ~/.ssh/id_ed25519 \
            "${{ secrets.NOMAD_BASTION_USER }}@${{ secrets.NOMAD_BASTION_HOST }}" \
            "IMAGE_TAG='${IMAGE_TAG}' REMOTE_HCL='${REMOTE_HCL}' bash -s" <<'REMOTE'
          set -euo pipefail
          source ~/credentials/nomad-bastion.env
          export NOMAD_ADDR NOMAD_TOKEN="$NOMAD_MGMT_TOKEN"

          # (2)+(3) Pré-pull des 2 images sur ovh-dev (auth ghcr du nœud). `-n`
          # IMPÉRATIF : sinon ce ssh lit le stdin du heredoc REMOTE et avale les
          # commandes nomad suivantes (faux vert : ancienne version reste live).
          echo "== pré-pull engine+bridge sur ovh-dev =="
          PULLED=""
          for attempt in 1 2 3; do
            if timeout 240s ssh -n -o BatchMode=yes -o ConnectTimeout=15 dev-pub \
              "docker pull ghcr.io/christ-roy/veridian-analytics-engine:${IMAGE_TAG} && docker pull ghcr.io/christ-roy/veridian-analytics-bridge:${IMAGE_TAG}"; then
              PULLED=1
              break
            fi
            echo "pré-pull staging tentative $attempt/3 en échec"
            sleep $((attempt * 10))
          done
          [ -n "$PULLED" ] || { echo "::error::pré-pull staging impossible après 3 tentatives"; exit 1; }

          echo "== nomad job validate =="
          /usr/bin/nomad job validate -var "image_tag=${IMAGE_TAG}" "$REMOTE_HCL"
          echo "== nomad job plan (diff, inoffensif) =="
          set +e
          PLAN_OUTPUT=$(/usr/bin/nomad job plan -no-color \
            -var "image_tag=${IMAGE_TAG}" "$REMOTE_HCL" 2>&1)
          PLAN_STATUS=$?
          set -e
          printf '%s\n' "$PLAN_OUTPUT"
          case "$PLAN_STATUS" in
            0) echo "plan sans création ou destruction d'allocation" ;;
            1) echo "plan avec remplacement d'allocation attendu" ;;
            *) echo "::error::nomad job plan a échoué (code=$PLAN_STATUS)"; exit "$PLAN_STATUS" ;;
          esac
          MODIFY_INDEX=$(printf '%s\n' "$PLAN_OUTPUT" \
            | sed -n 's/^Job Modify Index: \([0-9][0-9]*\)$/\1/p' | tail -1)
          RUN_INDEX_ARGS=()
          [ -n "$MODIFY_INDEX" ] && RUN_INDEX_ARGS=(-check-index "$MODIFY_INDEX")

          # (4) run -detach → Evaluation ID → DeploymentID → monitor CE déploiement.
          echo "== nomad job run -detach + monitor ciblé (image_tag=${IMAGE_TAG}) =="
          EVAL=$(/usr/bin/nomad job run -detach "${RUN_INDEX_ARGS[@]}" \
            -var "image_tag=${IMAGE_TAG}" "$REMOTE_HCL" \
            | grep -oP 'Evaluation ID:\s+\K\S+')
          echo "eval: ${EVAL:-none}"
          DEP=""
          for i in $(seq 1 15); do
            DEP=$(/usr/bin/nomad eval status -json "$EVAL" 2>/dev/null | python3 -c 'import sys,json;print(json.load(sys.stdin).get("DeploymentID") or "")' 2>/dev/null || true)
            [ -n "$DEP" ] && break
            sleep 2
          done
          if [ -z "$DEP" ]; then
            echo "Pas de déploiement créé (job inchangé = no-op) → OK"
          else
            echo "deployment: $DEP — monitoring jusqu'à terminal…"
            /usr/bin/nomad deployment status -monitor "$DEP"
          fi
          REMOTE

      - name: Cleanup secrets
        if: always()
        run: rm -f ~/.ssh/id_ed25519 ~/.ssh/known_hosts

  # ─── Étage 4 : Smoke applicatif post-deploy ───────────────────────
  #
  # La route staging est Tailscale-only (`internal-only@nomad` → 403 pour un
  # runner GitHub public). On SSH sur le bastion (dans le tailnet) et on curl la
  # route publique via l'ingress → assertions de contenu réelles sur engine+bridge.
  e2e-staging-smoke:
    name: Étage 4 — Smoke applicatif staging
    needs: deploy-staging
    if: github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Install SSH key (bastion)
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.NOMAD_DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.NOMAD_BASTION_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Smoke (curl route via bastion tailnet)
        run: |
          ssh -i ~/.ssh/id_ed25519 \
            "${{ secrets.NOMAD_BASTION_USER }}@${{ secrets.NOMAD_BASTION_HOST }}" bash -s <<'SMOKE'
          set -euo pipefail
          echo "── Engine /api/health → status:ok ──"
          BODY=$(curl -fsS --max-time 15 https://analytics-engine.staging.veridian.site/api/health)
          echo "  réponse : $BODY"
          echo "$BODY" | grep -q '"status":"ok"' \
            || { echo "::error::engine /api/health sans status:ok"; exit 1; }
          echo "── Console / → HTTP 200 ──"
          curl -fsS --max-time 15 -o /dev/null -w "  HTTP %{http_code}\n" \
            https://analytics-engine.staging.veridian.site/
          echo "Smoke staging : ✓ OK"
          SMOKE

      - name: Cleanup secrets
        if: always()
        run: rm -f ~/.ssh/id_ed25519 ~/.ssh/known_hosts
