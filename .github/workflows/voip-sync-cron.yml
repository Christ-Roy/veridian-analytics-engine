name: VoIP sync cron (hourly)

# Cron horaire pour pull les call logs (CDR) VoIP de tous les tenants ayant
# branché un provider (OVH Telephony / Telnyx) via la page Settings.
#
# Endpoint cible : POST /api/admin/voip/sync-all sur le bridge prod.
#
# ⚠️ DÉSACTIVÉ par défaut tant que le ticket B-VOIP n'est pas mergé sur
# staging puis prod. Pour activer :
#   1. B-VOIP mergé sur staging → tests verts
#   2. B-VOIP mergé sur main → cron-trigger activé
#   3. Créer la variable repo `VOIP_SYNC_ENABLED=true`
#      (Settings → Variables → Actions)
#
# Référence : todo/sprint-2026-05-22-mega/B-VOIP-call-logs.md
# Cohérent avec gsc-sync-cron.yml.

on:
  # enable when B-VOIP prod-ready :
  # schedule:
  #   - cron: '15 * * * *'   # toutes les heures à HH:15
  workflow_dispatch:
    inputs:
      target:
        description: "Cible : staging ou prod"
        type: choice
        options: [staging, prod]
        default: staging

permissions:
  contents: read

jobs:
  voip-sync:
    name: VoIP sync — ${{ inputs.target || 'prod' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Garde-fou : tant que B-VOIP pas activé en prod, on bloque l'exécution
    # réelle même si workflow_dispatch est déclenché par erreur.
    if: vars.VOIP_SYNC_ENABLED == 'true'
    steps:
      - name: Resolve bridge URL
        id: url
        run: |
          TARGET="${{ inputs.target || 'prod' }}"
          if [ "$TARGET" = "staging" ]; then
            echo "url=https://analytics-engine-bridge.staging.veridian.site" >> "$GITHUB_OUTPUT"
          else
            echo "url=https://analytics-engine-bridge.app.veridian.site" >> "$GITHUB_OUTPUT"
          fi

      - name: Call /api/admin/voip/sync-all
        env:
          BRIDGE_URL: ${{ steps.url.outputs.url }}
          ADMIN_API_KEY: ${{ secrets.VERIDIAN_ADMIN_API_KEY }}
        run: |
          if [ -z "$ADMIN_API_KEY" ]; then
            echo "::error::VERIDIAN_ADMIN_API_KEY secret manquant"
            exit 1
          fi
          RESPONSE=$(curl -sf -X POST \
            -H "Authorization: Bearer $ADMIN_API_KEY" \
            -H "Content-Type: application/json" \
            -d '{}' \
            --max-time 600 \
            "$BRIDGE_URL/api/admin/voip/sync-all")
          echo "$RESPONSE" | jq -r '.results[]? | "✓ \(.tenantId) — \(.totalUpserted) appels"' || echo "$RESPONSE"

      - name: Alert on failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue list --search '[voip-sync] in:title state:open' --json number --jq '.[0].number' || \
            gh issue create \
              --title "[voip-sync] sync échoué — $(date -u +%F)" \
              --body "Le cron VoIP sync a échoué. Voir run ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
              --label "bug" || true
