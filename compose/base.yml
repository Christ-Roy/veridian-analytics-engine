# ============================================================================
# compose/base.yml — Base commune Analytics Engine (prod + staging)
# ============================================================================
#
# Convention alignée sur veridian-hub/notifuse-veridian. Jamais lu seul.
# Toujours combiné avec un override :
#   - staging : docker compose -f compose/base.yml -f compose/staging.yml up -d
#   - prod    : docker compose -f compose/base.yml -f compose/prod.yml up -d
#
# 3 services :
#   - clickhouse : DB OLAP, partition par jour, TTL 7j (configurable)
#   - engine     : NestJS staminads + console embarquée
#   - bridge     : couche Veridian (auth + provisioning Hub)
#
# ============================================================================

services:
  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    pull_policy: always
    restart: unless-stopped
    environment:
      TZ: UTC
      CLICKHOUSE_DB: staminads_system
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?CLICKHOUSE_PASSWORD requis}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ../clickhouse-users.xml:/etc/clickhouse-server/users.d/users.xml:ro
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    labels:
      - veridian.staging.app=analytics-engine

  engine:
    image: ghcr.io/christ-roy/veridian-analytics-engine:${ENGINE_IMAGE_TAG:-latest}
    pull_policy: always
    restart: unless-stopped
    depends_on:
      clickhouse:
        condition: service_healthy
    environment:
      TZ: UTC
      PORT: "3000"
      # NODE_ENV : par défaut production. dev.yml l'override en development.
      NODE_ENV: ${NODE_ENV:-production}
      JWT_EXPIRES_IN: 7d
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?ENCRYPTION_KEY requis (32+ chars, openssl rand -hex 32)}
      # JWT_SECRET optionnel : si absent, le code retombe sur ENCRYPTION_KEY
      # (api/src/subscriptions/subscriptions.module.ts).
      JWT_SECRET: ${JWT_SECRET:-}
      CLICKHOUSE_HOST: http://clickhouse:8123
      CLICKHOUSE_SYSTEM_DATABASE: staminads_system
      CLICKHOUSE_DATABASE: staminads
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      IS_DEMO: "false"
      # SMTP global optionnel : si vide, chaque workspace doit configurer son
      # propre SMTP pour envoyer des emails (invitations, reset password).
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-Veridian Analytics}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-noreply@veridian.site}
      # DEMO_SECRET optionnel : protège les endpoints de génération de fixtures démo.
      DEMO_SECRET: ${DEMO_SECRET:-}
      # Secret M2M des endpoints /api/admin/platform/* (PlatformAdminGuard).
      # Sans lui, le guard refuse TOUTES les requêtes admin-platform (fail-closed),
      # donc provisionApiKey / tenants.provision répondent "not configured".
      # Requis dès qu'on déploie l'admin platform (cf api/src/admin-platform).
      PLATFORM_ADMIN_API_KEY: ${PLATFORM_ADMIN_API_KEY:?PLATFORM_ADMIN_API_KEY requis (M2M admin platform)}
      # ─── VoIP natif (port du bridge VoIP, cf voip/) ───────────────────────
      # Chiffrement des creds VoIP (AES-256-GCM clé-par-workspace). Optionnel :
      # si vide, VoipCrypto retombe sur ENCRYPTION_KEY (ci-dessus). Définir
      # uniquement pour faire tourner une clé VoIP indépendante.
      VOIP_ENCRYPTION_KEY: ${VOIP_ENCRYPTION_KEY:-}
      # Active le cron de synchro VoIP (@Cron toutes les 15 min). Off par
      # défaut (fail-soft) : tant qu'aucun client n'a branché OVH/Telnyx, on
      # ne pull rien. Passer à "true" une fois la téléphonie en prod.
      VOIP_SYNC_ENABLED: ${VOIP_SYNC_ENABLED:-false}
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:3000/api/setup.status || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

  postgres-bridge:
    image: postgres:16-alpine
    pull_policy: always
    restart: unless-stopped
    environment:
      TZ: UTC
      POSTGRES_DB: ${BRIDGE_DB_NAME:-veridian_bridge}
      POSTGRES_USER: ${BRIDGE_DB_USER:?BRIDGE_DB_USER requis}
      POSTGRES_PASSWORD: ${BRIDGE_DB_PASSWORD:?BRIDGE_DB_PASSWORD requis}
    volumes:
      - postgres-bridge-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${BRIDGE_DB_USER:-bridge} -d ${BRIDGE_DB_NAME:-veridian_bridge}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  bridge:
    image: ghcr.io/christ-roy/veridian-analytics-bridge:${BRIDGE_IMAGE_TAG:-latest}
    pull_policy: always
    restart: unless-stopped
    depends_on:
      engine:
        condition: service_healthy
      postgres-bridge:
        condition: service_healthy
    environment:
      TZ: UTC
      PORT: "3002"
      # NODE_ENV : par défaut production. Le boot guard assertSkipHmacAllowed()
      # refuse SKIP_HMAC=true si NODE_ENV ∉ {test, development}. dev.yml l'override.
      NODE_ENV: ${NODE_ENV:-production}
      STAMINADS_URL: http://engine:3000
      # Auth M2M bridge → Engine (Bearer PLATFORM_ADMIN_API_KEY, PlatformAdminGuard).
      # MÊME valeur que le service `engine` ci-dessus. Remplace l'ancien couple
      # super_admin STAMINADS_ADMIN_EMAIL/PASSWORD (anti-pattern getAdminToken,
      # retiré 2026-06-16 — cf veridian-bridge/docs ../docs/PLATFORM-ADMIN-API.md).
      PLATFORM_ADMIN_API_KEY: ${PLATFORM_ADMIN_API_KEY:?PLATFORM_ADMIN_API_KEY requis (M2M, 32+ chars)}
      VERIDIAN_ADMIN_API_KEY: ${VERIDIAN_ADMIN_API_KEY:?VERIDIAN_ADMIN_API_KEY requis (32+ chars)}
      # URL publique du dashboard renvoyée au Hub à la réponse /provision (CONTRAT-HUB §5.1)
      PUBLIC_DASHBOARD_URL: ${PUBLIC_DASHBOARD_URL:-https://analytics.app.veridian.site}
      # ─── Hub HMAC (B3 — contrat §5.x, §6.1) ───────────────────────────────
      # Secret partagé Hub↔bridge. SANS lui, /api/tenants/* refuse tout.
      HUB_HMAC_SECRET: ${HUB_HMAC_SECRET:?HUB_HMAC_SECRET requis (32+ chars hex)}
      # Bypass HMAC : interdit en prod/staging (boot guard throw). dev.yml l'override.
      SKIP_HMAC: ${SKIP_HMAC:-false}
      # ─── Push Notifications PWA (B2) — ARCHIVED 2026-05-23 ────────────────
      # Scope change : VAPID retiré du périmètre. Code conservé dans
      # veridian-bridge/_archive/push/. Re-définir VAPID_PUBLIC_KEY /
      # VAPID_PRIVATE_KEY / VAPID_SUBJECT en cas de réactivation.
      # GSC integration (A4)
      BRIDGE_DATABASE_URL: postgresql://${BRIDGE_DB_USER:-bridge}:${BRIDGE_DB_PASSWORD:-bridge_pwd}@postgres-bridge:5432/${BRIDGE_DB_NAME:-veridian_bridge}
      BRIDGE_DB_HOST: postgres-bridge
      BRIDGE_DB_PORT: "5432"
      BRIDGE_DB_USER: ${BRIDGE_DB_USER:-bridge}
      BRIDGE_DB_PASSWORD: ${BRIDGE_DB_PASSWORD:-bridge_pwd}
      BRIDGE_DB_NAME: ${BRIDGE_DB_NAME:-veridian_bridge}
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-}
      GOOGLE_OAUTH_REDIRECT_URI: ${GOOGLE_OAUTH_REDIRECT_URI:-}
      TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY:-}
      GSC_DASHBOARD_REDIRECT_URL: ${GSC_DASHBOARD_REDIRECT_URL:-}
      GSC_CRON_ALLOWED_IPS: ${GSC_CRON_ALLOWED_IPS:-}
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:3002/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  clickhouse-data:
  postgres-bridge-data:
