# ============================================================================
# compose/dev.yml — Environnement DEV hot-reload sur dev-pub (Tailscale only)
# ============================================================================
#
# But : itérer vite. Modif locale → push branche `dev` → ssh dev-pub → la
# stack se reload toute seule (NestJS watch, tsx watch, Vite HMR).
#
# Pas d'image GHCR : build local sur dev-pub depuis Dockerfile.dev. Code source
# bind-monté depuis /opt/dev/analytics-engine (clone du repo branche `dev`).
#
# Exposition : pas de Traefik. Ports liés à 127.0.0.1 + tailscale serve qui les
# proxy en HTTPS sur le hostname Tailscale du dev-server (dev-server-1.tail324436.ts.net).
#
# NE PAS combiner avec base.yml — c'est un compose autonome (pas d'image GHCR).
#
# Variables d'env attendues (cf .env.dev) :
#   CLICKHOUSE_PASSWORD       = mot de passe ClickHouse dev (peu importe, isolé)
#   ENCRYPTION_KEY            = 32+ chars
#   STAMINADS_ADMIN_PASSWORD  = mot de passe admin console staminads
#   VERIDIAN_ADMIN_API_KEY    = clé API bridge (réutilisable depuis staging)
# ============================================================================

services:
  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    container_name: analytics-engine-dev-clickhouse
    restart: unless-stopped
    environment:
      TZ: UTC
      CLICKHOUSE_DB: staminads_system
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?CLICKHOUSE_PASSWORD requis}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes:
      - clickhouse-dev-data:/var/lib/clickhouse
      - ../clickhouse-users.xml:/etc/clickhouse-server/users.d/users.xml:ro
    ports:
      - "127.0.0.1:8123:8123"
    networks:
      - engine-internal
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  engine:
    build:
      context: ..
      dockerfile: Dockerfile.dev
    container_name: analytics-engine-dev
    restart: unless-stopped
    depends_on:
      clickhouse:
        condition: service_healthy
    environment:
      TZ: UTC
      PORT: "3000"
      NODE_ENV: development
      JWT_EXPIRES_IN: 7d
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?ENCRYPTION_KEY requis}
      APP_URL: ${APP_URL:-https://dev-server-1.tail324436.ts.net}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://dev-server-1.tail324436.ts.net}
      CLICKHOUSE_HOST: http://clickhouse:8123
      CLICKHOUSE_SYSTEM_DATABASE: staminads_system
      CLICKHOUSE_DATABASE: staminads
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      ADMIN_EMAIL: ${STAMINADS_ADMIN_EMAIL:-admin@veridian.site}
      ADMIN_PASSWORD: ${STAMINADS_ADMIN_PASSWORD:?STAMINADS_ADMIN_PASSWORD requis}
      IS_DEMO: "false"
      # Hot reload : chokidar a besoin de polling dans Docker pour voir les
      # changements depuis un bind-mount sur certains systèmes de fichiers.
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
    volumes:
      - ../api:/app/api
      - ../console:/app/console
      - ../sdk:/app/sdk
      # node_modules : on garde ceux installés dans l'image (Linux/alpine)
      # pour ne pas écraser avec ceux de l'hôte (qui peut être autre OS/arch)
      - engine-api-node-modules:/app/api/node_modules
      - engine-console-node-modules:/app/console/node_modules
      - engine-sdk-node-modules:/app/sdk/node_modules
    ports:
      - "127.0.0.1:3000:3000"
    networks:
      - engine-internal
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:3000/api/setup.status || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 120s

  bridge:
    build:
      context: ../veridian-bridge
      dockerfile: Dockerfile.dev
    container_name: analytics-engine-dev-bridge
    restart: unless-stopped
    depends_on:
      engine:
        condition: service_healthy
    environment:
      TZ: UTC
      PORT: "3002"
      NODE_ENV: development
      STAMINADS_URL: http://engine:3000
      STAMINADS_ADMIN_EMAIL: ${STAMINADS_ADMIN_EMAIL:-admin@veridian.site}
      STAMINADS_ADMIN_PASSWORD: ${STAMINADS_ADMIN_PASSWORD:?STAMINADS_ADMIN_PASSWORD requis}
      VERIDIAN_ADMIN_API_KEY: ${VERIDIAN_ADMIN_API_KEY:?VERIDIAN_ADMIN_API_KEY requis}
      PUBLIC_STAMINADS_URL: ${PUBLIC_STAMINADS_URL:-https://dev-server-1.tail324436.ts.net}
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ../veridian-bridge/src:/app/src
      - ../veridian-bridge/tests:/app/tests
      - ../veridian-bridge/tsconfig.json:/app/tsconfig.json:ro
      - bridge-node-modules:/app/node_modules
    ports:
      - "127.0.0.1:3002:3002"
    networks:
      - engine-internal
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:3002/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  clickhouse-dev-data:
  engine-api-node-modules:
  engine-console-node-modules:
  engine-sdk-node-modules:
  bridge-node-modules:

networks:
  engine-internal:
    driver: bridge
