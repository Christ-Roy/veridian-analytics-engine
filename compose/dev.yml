# ============================================================================
# compose/dev.yml — Environnement DEV hot-reload sur dev-pub (Traefik staging-edge)
# ============================================================================
#
# But : itérer vite. Modif locale → push branche `dev` → ssh dev-pub → la
# stack se reload toute seule (NestJS watch, tsx watch, Vite HMR).
#
# Pas d'image GHCR : build local sur dev-pub depuis Dockerfile.dev. Code source
# bind-monté depuis /opt/dev/analytics-engine (clone du repo branche `staging`).
#
# Exposition : Traefik staging-edge (réseau privé Tailscale uniquement).
# Le wildcard *.staging.veridian.site → dev-pub (joignable uniquement via tailnet).
# Pas d'exposition Internet publique.
#
# URLs (depuis n'importe quelle machine sur le tailnet) :
#   - https://analytics-engine-dev.staging.veridian.site/          → engine
#   - https://analytics-engine-bridge-dev.staging.veridian.site/   → bridge
#
# ⚠️ PROJECT NAME ISOLÉ : on force `name: analytics-engine-dev` pour ne PAS
# partager le project name avec le compose staging (incident 2026-05-18 :
# `--remove-orphans` supprime les containers staging).
#
# Variables d'env attendues (cf .env.dev) :
#   CLICKHOUSE_PASSWORD       = mot de passe ClickHouse dev (peu importe, isolé)
#   ENCRYPTION_KEY            = 32+ chars
#   STAMINADS_ADMIN_PASSWORD  = mot de passe admin console staminads
#   VERIDIAN_ADMIN_API_KEY    = clé API bridge (réutilisable depuis staging)
# ============================================================================

name: analytics-engine-dev

services:
  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    container_name: analytics-engine-dev-clickhouse
    restart: unless-stopped
    environment:
      TZ: UTC
      CLICKHOUSE_DB: staminads_system
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?CLICKHOUSE_PASSWORD requis}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes:
      - clickhouse-dev-data:/var/lib/clickhouse
      - ../clickhouse-users.xml:/etc/clickhouse-server/users.d/users.xml:ro
    networks:
      - engine-internal
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  engine:
    build:
      context: ..
      dockerfile: Dockerfile.dev
    container_name: analytics-engine-dev
    restart: unless-stopped
    depends_on:
      clickhouse:
        condition: service_healthy
    environment:
      TZ: UTC
      PORT: "3000"
      NODE_ENV: development
      JWT_EXPIRES_IN: 7d
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?ENCRYPTION_KEY requis}
      APP_URL: https://analytics-engine-dev.staging.veridian.site
      CORS_ALLOWED_ORIGINS: https://analytics-engine-dev.staging.veridian.site,https://analytics-engine-bridge-dev.staging.veridian.site
      CLICKHOUSE_HOST: http://clickhouse:8123
      CLICKHOUSE_SYSTEM_DATABASE: staminads_system
      CLICKHOUSE_DATABASE: staminads
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      ADMIN_EMAIL: ${STAMINADS_ADMIN_EMAIL:-admin@veridian.site}
      ADMIN_PASSWORD: ${STAMINADS_ADMIN_PASSWORD:?STAMINADS_ADMIN_PASSWORD requis}
      IS_DEMO: "false"
      # Hot reload : chokidar a besoin de polling dans Docker pour voir les
      # changements depuis un bind-mount sur certains systèmes de fichiers.
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
    volumes:
      - ../api:/app/api
      - ../console:/app/console
      - ../sdk:/app/sdk
      # node_modules : on garde ceux installés dans l'image (Linux/alpine)
      # pour ne pas écraser avec ceux de l'hôte (qui peut être autre OS/arch)
      - engine-api-node-modules:/app/api/node_modules
      - engine-console-node-modules:/app/console/node_modules
      - engine-sdk-node-modules:/app/sdk/node_modules
    networks:
      - staging-edge
      - engine-internal
    labels:
      - traefik.enable=true
      - traefik.docker.network=staging-edge
      - traefik.http.routers.analytics-engine-dev.rule=Host(`analytics-engine-dev.staging.veridian.site`)
      - traefik.http.routers.analytics-engine-dev.entrypoints=websecure
      - traefik.http.routers.analytics-engine-dev.tls=true
      - traefik.http.routers.analytics-engine-dev.tls.certresolver=letsencrypt
      - traefik.http.services.analytics-engine-dev.loadbalancer.server.port=3000
      - veridian.staging.app=analytics-engine-dev
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:3000/api/setup.status || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 120s

  bridge:
    build:
      context: ../veridian-bridge
      dockerfile: Dockerfile.dev
    container_name: analytics-engine-dev-bridge
    restart: unless-stopped
    depends_on:
      engine:
        condition: service_healthy
      postgres-bridge:
        condition: service_healthy
    environment:
      TZ: UTC
      PORT: "3002"
      NODE_ENV: development
      STAMINADS_URL: http://engine:3000
      STAMINADS_ADMIN_EMAIL: ${STAMINADS_ADMIN_EMAIL:-admin@veridian.site}
      STAMINADS_ADMIN_PASSWORD: ${STAMINADS_ADMIN_PASSWORD:?STAMINADS_ADMIN_PASSWORD requis}
      VERIDIAN_ADMIN_API_KEY: ${VERIDIAN_ADMIN_API_KEY:?VERIDIAN_ADMIN_API_KEY requis}
      PUBLIC_STAMINADS_URL: https://analytics-engine-dev.staging.veridian.site
      PUBLIC_DASHBOARD_URL: https://analytics-engine-dev.staging.veridian.site
      # Hub HMAC (B3) : en dev on bypass via SKIP_HMAC (NODE_ENV=development
      # autorise le bypass — assertSkipHmacAllowed). HUB_HMAC_SECRET reste
      # passé pour tester la vraie signature si SKIP_HMAC=false.
      HUB_HMAC_SECRET: ${HUB_HMAC_SECRET:-dev-hmac-secret-not-for-prod-0000000000}
      SKIP_HMAC: ${SKIP_HMAC:-true}
      # Push Notifications PWA (B2) : clés VAPID. En dev, valeurs vides
      # tolérées (le code log un warn et /api/push/send échoue proprement).
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:contact@veridian.site}
      # GSC integration (A4)
      BRIDGE_DATABASE_URL: postgresql://${BRIDGE_DB_USER:-bridge}:${BRIDGE_DB_PASSWORD:-bridge_pwd}@postgres-bridge:5432/${BRIDGE_DB_NAME:-veridian_bridge}
      BRIDGE_DB_HOST: postgres-bridge
      BRIDGE_DB_PORT: "5432"
      BRIDGE_DB_USER: ${BRIDGE_DB_USER:-bridge}
      BRIDGE_DB_PASSWORD: ${BRIDGE_DB_PASSWORD:-bridge_pwd}
      BRIDGE_DB_NAME: ${BRIDGE_DB_NAME:-veridian_bridge}
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-}
      GOOGLE_OAUTH_REDIRECT_URI: ${GOOGLE_OAUTH_REDIRECT_URI:-https://analytics-engine-bridge-dev.staging.veridian.site/api/admin/gsc/oauth-callback}
      TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY:-}
      GSC_DASHBOARD_REDIRECT_URL: ${GSC_DASHBOARD_REDIRECT_URL:-}
      GSC_CRON_ALLOWED_IPS: ${GSC_CRON_ALLOWED_IPS:-}
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ../veridian-bridge/src:/app/src
      - ../veridian-bridge/tests:/app/tests
      - ../veridian-bridge/tsconfig.json:/app/tsconfig.json:ro
      - bridge-node-modules:/app/node_modules
    networks:
      - staging-edge
      - engine-internal
    labels:
      - traefik.enable=true
      - traefik.docker.network=staging-edge
      - traefik.http.routers.analytics-engine-bridge-dev.rule=Host(`analytics-engine-bridge-dev.staging.veridian.site`)
      - traefik.http.routers.analytics-engine-bridge-dev.entrypoints=websecure
      - traefik.http.routers.analytics-engine-bridge-dev.tls=true
      - traefik.http.routers.analytics-engine-bridge-dev.tls.certresolver=letsencrypt
      - traefik.http.services.analytics-engine-bridge-dev.loadbalancer.server.port=3002
      - veridian.staging.app=analytics-engine-dev
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:3002/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  postgres-bridge:
    image: postgres:16-alpine
    container_name: analytics-engine-dev-postgres-bridge
    restart: unless-stopped
    environment:
      TZ: UTC
      POSTGRES_DB: ${BRIDGE_DB_NAME:-veridian_bridge}
      POSTGRES_USER: ${BRIDGE_DB_USER:?BRIDGE_DB_USER requis}
      POSTGRES_PASSWORD: ${BRIDGE_DB_PASSWORD:?BRIDGE_DB_PASSWORD requis}
    volumes:
      - postgres-bridge-dev-data:/var/lib/postgresql/data
    networks:
      - engine-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${BRIDGE_DB_USER:-bridge} -d ${BRIDGE_DB_NAME:-veridian_bridge}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  clickhouse-dev-data:
  postgres-bridge-dev-data:
  engine-api-node-modules:
  engine-console-node-modules:
  engine-sdk-node-modules:
  bridge-node-modules:

networks:
  staging-edge:
    external: true
  engine-internal:
    driver: bridge
