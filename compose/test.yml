# ============================================================================
# compose/test.yml — Services éphémères pour les tests d'INTÉGRATION du bridge
# ============================================================================
#
# Lu SEUL (pas combiné avec base.yml — c'est un stack autonome).
#
#   docker compose -f compose/test.yml up -d
#   docker compose -f compose/test.yml down -v
#
# Sert deux types de tests :
#   - tests/integration/**/*.integration.test.ts  → tapent un VRAI Postgres
#   - tests qui touchent staminads (score, push) → ClickHouse réel
#
# Différences volontaires avec dev.yml / staging.yml :
#   - AUCUN volume persistant : la DB est fraîche à chaque `up`. On veut une
#     base vierge pour que `prisma migrate deploy` parte de zéro et que les
#     tests soient déterministes.
#   - Ports décalés (55432 / 58123 / 59000) pour ne JAMAIS collisionner avec
#     un stack dev (5432) ou staging tournant sur la même machine.
#   - tmpfs sur le datadir Postgres : I/O en RAM = tests plus rapides, et
#     garantie supplémentaire que rien ne survit au container.
#   - project name fixe `analytics-engine-test` (cf feedback_docker_compose
#     _project_isolation : un --remove-orphans sans project isolé a déjà tué
#     staging le 2026-05-18).
#
# Le harness `tests/integration/_harness/` lit ces coordonnées via les ENV :
#   BRIDGE_TEST_DATABASE_URL  (default ci-dessous)
#   CLICKHOUSE_TEST_HOST      (default ci-dessous)
# ============================================================================

name: analytics-engine-test

services:
  # ─── Postgres éphémère pour le bridge ────────────────────────────────────
  postgres-bridge-test:
    image: postgres:16-alpine
    restart: "no"
    environment:
      TZ: UTC
      POSTGRES_DB: veridian_bridge_test
      POSTGRES_USER: bridge_test
      POSTGRES_PASSWORD: bridge_test_pwd
      # Speed-ups sûrs pour une DB jetable : pas de fsync, pas de WAL durable.
      # On ne perd RIEN d'important si le container crash — la base est jetable.
      POSTGRES_INITDB_ARGS: "--nosync"
    command:
      - postgres
      - -c
      - fsync=off
      - -c
      - synchronous_commit=off
      - -c
      - full_page_writes=off
    ports:
      - "55432:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bridge_test -d veridian_bridge_test"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s

  # ─── ClickHouse éphémère (tests score / push contre staminads réelle) ────
  clickhouse-test:
    image: clickhouse/clickhouse-server:24.8
    restart: "no"
    environment:
      TZ: UTC
      CLICKHOUSE_DB: staminads_test
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ""
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ports:
      - "58123:8123"
      - "59000:9000"
    tmpfs:
      - /var/lib/clickhouse
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8123/ping"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s
