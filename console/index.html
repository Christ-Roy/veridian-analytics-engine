<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Veridian Analytics — analytique web propriétaire des sites Veridian." />
    <meta property="og:title" content="Veridian Analytics" />
    <meta property="og:description" content="Veridian Analytics — analytique web propriétaire des sites Veridian." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary" />
    <title>Veridian Analytics</title>
    <style>
      /* Branded splash visible before React hydration — covers BUG-20 (FOUC).
         Once #root has children, the splash fades out (CSS sibling selector). */
      #initial-splash {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0e7e5d;
        z-index: 0;
        transition: opacity 0.25s ease-out;
      }
      #initial-splash img {
        width: 140px;
        height: auto;
      }
      #root:not(:empty) ~ #initial-splash {
        opacity: 0;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="initial-splash" aria-hidden="true">
      <img src="/veridian-logo.svg" alt="Veridian Analytics" />
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
