  reason: |
    Port de l'intégration GSC depuis veridian-analytics legacy.
    - oauth.ts : chiffrement AES-256-GCM, state HMAC, exchange/refresh tokens
    - sync.ts : pull GSC API → upsert GscDaily, backoff 429/5xx
    - query.ts : DSL dashboard (groupBy, filtres, totals, dashboardSummary)
    - routes.ts : 5 endpoints HTTP (oauth-begin, oauth-callback, sync,
      sync-all, /tenant/:workspaceId/gsc)

    Tests UNITAIRES (covered_by) : 4 fichiers — oauth/sync/query contre
    FakePrismaClient + 1 e2e Express full flow (mock Google).

    Tests d'INTÉGRATION RÉELS (integration_covered_by — ticket T4) : 4
    fichiers `*.integration.test.ts` qui tapent un VRAI Postgres via le
    harness `bootBridgeWithRealDB()` (T1). Ce que les fakes ne pouvaient
    PAS prouver :
    - oauth-flow : les tokens OAuth sont RÉELLEMENT chiffrés AES-256-GCM
      dans `GscProperty.oauthAccount` — lecture SQL brute qui vérifie
      qu'aucun secret n'est en clair ; state HMAC falsifié rejeté avant
      écriture ; upsert idempotent (vraie contrainte @@unique).
    - sync : `syncProperty` upsert RÉELLEMENT en Postgres ; re-sync
      idempotent garanti par la vraie contrainte @@unique sur les 7
      dimensions (gscPropertyId,date,query,page,country,device,searchType) ;
      backoff 429/5xx ; syncAllVerified ne traite que les verified.
    - query : `queryProperty`/`dashboardSummary` calculent les agrégats
      (SUM, GROUP BY, ORDER BY, ILIKE, position pondérée) par de VRAIES
      requêtes SQL `$queryRawUnsafe`, pas par le ré-impl JS du fake.
    - cascade : suppression Tenant → cascade FK réelle sur GscProperty
      puis GscDaily ; isolation inter-tenants ; @@unique (tenantId,
      siteUrl) ; FK P2003.
    Suite SÉRIALISÉE (`--test-concurrency=1`) + fichiers auto-isolants
    (Tenant à id unique, assertions scopées) → déterministe.

