# test-coverage-map.yaml — Veridian Analytics Engine (fork staminads v6.1.0)
#
# Convention CI Veridian (cf CI-ARCHITECTURE.md §1) :
#   1. Mapping canonique : <source>.ts ↔ <source>.spec.ts (Jest) ou
#      <source>.test.ts (Vitest/node:test) colocalisé OU
#      api/test/<base>.e2e-spec.ts (e2e Jest)
#   2. Si pas de mapping canonique → cherche ici
#   3. Le hook scripts/ci/check-test-mapping.sh exige qu'au moins un
#      covered_by soit modifié dans la même PR
#
# Audit upstream :
# Quasiment tous les controllers/services NestJS staminads sont couverts
# par leurs e2e dans api/test/*.e2e-spec.ts. On les déclare explicitement
# ici pour que la modif d'un controller upstream sans toucher son e2e
# soit refusée par le pre-push.

# ─── BRIDGE VERIDIAN (notre code) ───────────────────────────────────────

