  covered_by:
    - veridian-bridge/tests/hub/attach-owner.test.ts
    - veridian-bridge/tests/hub/attach-owner-idempotent.test.ts
  integration_covered_by:
    - veridian-bridge/tests/integration/hub/attach-owner.integration.test.ts
  reason: |
    Endpoint POST /api/tenants/attach-owner (CONTRAT-HUB §5.3). Lie un
    user au tenant en mode OWNER. Idempotent : same (tenant, email, user_id)
    → already_attached:true. 404 si tenant inexistant.
    Intégration T2 (attach-owner.integration.test.ts) : le lien user↔tenant
    est vérifié RÉELLEMENT dans la table annexe TenantOwner de Postgres ;
    re-attach idempotent prouvé par COUNT(*) = 1 (pas de doublon).

