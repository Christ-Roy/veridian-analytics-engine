# ─── BRIDGE HUB CONTRACT (B3 — CONTRAT-HUB §5.1, §5.3, §5.5, §6.1) ─────

- sources:
    - veridian-bridge/src/hub-hmac.ts
  covered_by:
    - veridian-bridge/tests/hub/hmac-valid.test.ts
    - veridian-bridge/tests/hub/hmac-invalid-signature.test.ts
    - veridian-bridge/tests/hub/hmac-replay-attack.test.ts
    - veridian-bridge/tests/hub/hmac-body-modified.test.ts
  integration_covered_by:
    - veridian-bridge/tests/integration/hub/hmac.integration.test.ts
  reason: |
    Lib HMAC Hub (Pattern A §6.1) : verifyHubHmac + hubHmacMiddleware +
    assertSkipHmacAllowed. 4 fichiers de tests couvrent : signature valide,
    signature invalide, anti-replay timestamp ±5min, body modifié après
    signature. Constant-time compare via crypto.timingSafeEqual.
    Intégration T2 (hmac.integration.test.ts) : prouve l'effet de bord RÉEL
    contre un vrai Postgres — signature valide → mutation persistée en DB ;
    replay / tamper / bad-sig / headers manquants → 401 ET la table Tenant
    reste vide (le middleware court-circuite avant le handler).

- sources:
    - veridian-bridge/src/paywall.ts
  covered_by:
    - veridian-bridge/tests/hub/paywall-required.test.ts
  integration_covered_by:
    - veridian-bridge/tests/integration/hub/paywall.integration.test.ts
  reason: |
    Lib paywall V1 (stub) : requireActivePlan() lève PaywallError(402) si
    tenant.status ∈ {suspended, trial_expired, soft_deleted}. V2 (S3) :
    obfuscation field-level. Tests : 6 scénarios couvrant tous les status +
    helper isPlanActive + tenant introuvable.
    Intégration T2 (paywall.integration.test.ts) : requireActivePlan branché
    sur le VRAI PrismaTenantStore — status posé directement en Postgres, les
    3 statuts non-actifs lèvent 402, un UPDATE de status en DB est reflété
    immédiatement (pas de cache mémoire).

