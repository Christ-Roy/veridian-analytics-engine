    - veridian-bridge/tests/config.test.ts
  reason: |
    index.ts = entrypoint qui lit process.env et appelle createApp.
    Toute la logique est dans app.ts (testée). config.test valide que
    validateConfig() rejette bien les configs invalides — ce qui est
