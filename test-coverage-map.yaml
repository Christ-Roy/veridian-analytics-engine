    - veridian-bridge/tests/integration/hub/attach-owner.integration.test.ts
    - veridian-bridge/tests/integration/hub/health.integration.test.ts
    - veridian-bridge/tests/integration/hub/paywall.integration.test.ts
  reason: |
    Interface TenantStore + impl InMemoryTenantStore. À substituer par
    PrismaTenantStore quand A4 sera mergée (Tenant model déjà câblé en A4
    avec les colonnes B3 préemptées : hubTenantId, plan, planSource, status,
    apiKey, suspendedAt, softDeletedAt). Tests provision + attach-owner +
    paywall exercent toutes les méthodes du store.
    Intégration T2 : les 4 suites hub/ exercent PrismaTenantStore contre un
    VRAI Postgres — create/refreshApiKey/attachOwner/findById/findByHubTenantId
    avec les vraies contraintes @@unique (P2002) et la cascade FK.

- sources:
    - veridian-bridge/src/hub/provision.ts
  covered_by:
    - veridian-bridge/tests/hub/provision-cas-a.test.ts
    - veridian-bridge/tests/hub/provision-cas-b.test.ts
    - veridian-bridge/tests/hub/provision-cas-c.test.ts
  integration_covered_by:
    - veridian-bridge/tests/integration/hub/provision.integration.test.ts
  reason: |
    Endpoint POST /api/tenants/provision (CONTRAT-HUB §5.1). 3 cas
    idempotents A/B/C : nouveau tenant, ré-attach (refresh apiKey),
    conflit owner_email (409). Coordonne avec hook staminads pour créer
    workspace + apiKey.
    Intégration T2 (provision.integration.test.ts) : les 3 cas A/B/C contre
    un VRAI Postgres — Cas A vérifie la row Tenant réellement écrite et
    relisible, Cas B l'idempotence + refresh apiKey persisté, Cas C le 409
    sans mutation. Couvre aussi les vraies contraintes @@unique
    (workspaceId / hubTenantId / apiKey → P2002).

- sources:
