# ─── GSC integration (A4) ─────────────────────────────────────────────

- sources:
    - veridian-bridge/src/gsc/index.ts
    - veridian-bridge/src/gsc/oauth.ts
    - veridian-bridge/src/gsc/sync.ts
    - veridian-bridge/src/gsc/query.ts
    - veridian-bridge/src/gsc/routes.ts
  covered_by:
